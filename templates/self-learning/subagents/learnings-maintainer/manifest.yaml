apiVersion: agent-platform/v1alpha1
kind: Subagent

metadata:
  name: learnings-maintainer
  version: 0.1.0
  description: Focused subagent for diagnosing repeated learning-log errors and selecting source repairs.
  tags:
    - self-learning
    - maintenance
    - subagent

spec:
  runtime: markdown-subagent
  entrypoint: PROMPT.md
  model: default
  delegation:
    mode: focused
    maxDepth: 1
    spawnable: []
  tools:
    - read
    - search
    - shell.read
  inputs:
    - name: audit_report
      type: text
      required: false
  outputs:
    - name: maintenance_recommendation
      type: text

permissions:
  filesystem:
    read:
      - ".learnings/**"
      - ".agents/**"
      - ".claude/**"
      - ".codex/hooks/**"
      - "AGENTS.md"
      - "CLAUDE.md"
    write: []
  network: false
  tools:
    - shell.read

dependencies:
  skills:
    - maintain-learnings@>=0.1.0
  workflows: []
  subagents: []
  hooks: []

events:
  triggers:
    - delegated
    - recurringError

compatibility:
  platforms:
    - codex
    - claude-code

