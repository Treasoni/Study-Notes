apiVersion: agent-platform/v1alpha1
kind: Skill

metadata:
  name: maintain-learnings
  version: 0.1.0
  description: Audit recurring learning errors, repair the source mechanism, validate, then archive fixed records.
  tags:
    - self-learning
    - maintenance
    - governance

spec:
  runtime: markdown-skill
  entrypoint: SKILL.md
  activation:
    mode: explicit-or-description
    description: Trigger when learning logs are too long, errors recur, or Codex and Claude Code skills need sync.
  scripts:
    - scripts/audit_learnings.py
    - scripts/sync_platform_skills.py
    - scripts/manifest_registry.py
  inputs:
    - name: project_root
      type: directory
      required: false
  outputs:
    - name: audit_report
      type: text
    - name: repaired_sources
      type: file-set

permissions:
  filesystem:
    read:
      - ".learnings/**"
      - ".agents/**"
      - ".claude/**"
      - ".codex/hooks/**"
      - "AGENTS.md"
      - "CLAUDE.md"
    write:
      - ".learnings/**"
      - ".agents/**"
      - ".claude/**"
      - ".codex/hooks/**"
  network: false
  tools:
    - shell.read
    - shell.execute
    - file.edit

dependencies:
  skills: []
  workflows: []
  subagents:
    - learnings-maintainer@>=0.1.0
  hooks:
    - read-learnings@>=0.1.0

events:
  triggers:
    - onDemand
    - recurringError
    - overThreshold

compatibility:
  platforms:
    - codex
    - claude-code

