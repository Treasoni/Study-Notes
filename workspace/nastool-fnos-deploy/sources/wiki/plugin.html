<p><strong>MoviePilot目前已有：</strong></p>
<ul>
<li><strong>v1.0+：<code>200+</code> 个插件</strong></li>
<li><strong>v2.0+：<code>400+</code> 个插件</strong></li>
<li><strong>v3.0+：<code>500+</code> 个插件</strong></li>
</ul>
<p>通过在变量<code>PLUGIN_MARKET</code>中添加第三方插件仓库地址后（v2版本点击插件页面图标维护），即可在插件市场中看到对应的插件。<strong>通过插件市场下载和更新插件需要良好的网络环境，能正确连接Github，同时需要配置Github Token。</strong></p>
<p>插件市场仓库地址仅支持Github仓库<code>main</code>分支，多个地址使用<code>,</code>分隔，通过查看 <a href="https://github.com/jxxghp/MoviePilot-Plugins" class="is-external-link">MoviePilot-Plugins</a> 项目的fork，或者查看频道置顶了解更多第三方插件仓库。</p>
<blockquote class="is-info">
<p>插件适配V2版本需要插件开发者进行兼容改造或者在插件代码中声明支持V2，如发现V1版本中的插件在V2版本的插件市场中不显示，需联系插件开发者修改支持。</p>
</blockquote>
<blockquote class="is-info">
<p>插件开发者请从插件仓库的 <a href="https://github.com/jxxghp/MoviePilot-Plugins/blob/main/docs/Plugin_Development.md" class="is-external-link">MoviePilot 插件开发指南（V3）</a> 开始。已有 V2 插件迁移、旧导入兼容、媒体身份和存量数据问题，再查看 <a href="https://github.com/jxxghp/MoviePilot-Plugins/blob/main/docs/V3_Plugin_Adaptation.md" class="is-external-link">V2 插件迁移到 V3</a>；API 与 Vue 远程组件另见 <a href="https://github.com/jxxghp/MoviePilot-Plugins/blob/main/docs/V3_API_Response_Adaptation.md" class="is-external-link">插件 API 专题</a>。</p>
</blockquote>

<h1 id="插件安装升级" class="toc-header"><a class="toc-anchor" href="#插件安装升级">¶</a> 插件安装/升级</h1>
<p>插件市场、插件安装/升级等需要多次访问Github，需要保障良好的网络连接才能顺畅安装和使用插件。</p>
<ul>
<li>配置<code>GITHUB_TOKEN</code>可以提升Github Api的访问次数限制，避免触发限流。</li>
<li>配置<code>GITHUB_PROXY</code>可以使用加速站下载Github插件文件。</li>
<li>配置<code>PIP_PROXY</code>可以镜像站下载插件所需要的依赖包。</li>
<li>配置<code>代理服务器</code>或者将MoviePilot接入代理网络可以大大提升Github的连通性。</li>
</ul>
<p>详情参见 <a href="/configuration" class="is-internal-link is-valid-page">配置参考</a> 相关变量说明。</p>
<h1 id="插件数据和仪表板" class="toc-header"><a class="toc-anchor" href="#插件数据和仪表板">¶</a> 插件数据和仪表板</h1>
<p>部门插件支持展示数据，点击插件后可查看<strong>插件数据页面</strong>；部分插件支持显示<strong>仪表板组件</strong>，启用插件后可在仪表板中开启使用。</p>
<h1 id="常用插件介绍" class="toc-header"><a class="toc-anchor" href="#常用插件介绍">¶</a> 常用插件介绍</h1>
<ul>
<li><code>配置中心</code>：针对未开放WEB UI的可通过配置文件配置的变量提供图形化配置界面。<code>v2.0+已内置几乎所有的配置项</code></li>
<li><code>站点数据统计</code>：统计和展示站点的上传量、下载量、分享率、保种量等数据。<code>v2.0+已内置此功能</code></li>
<li><code>目录监控</code>：监控文件夹，文件夹内有新增文件时自动整理到媒体库。<code>v2.0+已内置此功能</code></li>
<li><code>站点自动签到</code>：自动完成站点签到或者模断登录站点，避免长时间未登录被封禁。</li>
<li><code>豆瓣想看</code>：豆瓣加入想看后自动订阅搜索和下载。</li>
<li><code>豆瓣榜单订阅</code>：关注豆瓣榜单，媒体库不存在的自动添加订阅。</li>
<li><code>媒体库服务器通知</code>：媒体库服务器发生入库、插入等事件时发送通知。</li>
<li><code>媒体库服务器刷新</code>：文件整理完成后，通知媒体库软件立即刷新。</li>
<li><code>ChatGPT</code>：使用ChatGPT增强资源识别。</li>
<li><code>IYUU自动辅种</code>：无需安装IYUUAutoSeed客户端实现自动辅种。</li>
<li><code>MoviePilot更新推送</code>：自动更新MoviePilot到最新版本。</li>
</ul>
<p>更多精彩，插件市场等你发现！</p>
