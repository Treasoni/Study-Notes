<p>搜索媒体信息后，通过点击媒体卡片的 <img class="emoji" draggable="false" alt="❤️" src="/_assets/svg/twemoji/2764.svg"> ，或者点击媒体详情的<code>订阅</code>按钮添加订阅。</p>
<h2 id="v3-音乐订阅" class="toc-header"><a class="toc-anchor" href="#v3-音乐订阅">¶</a> V3 音乐订阅</h2>
<p>V3 支持创建歌曲或专辑订阅。音乐订阅会复用现有订阅站点、订阅刷新、资源过滤、下载和整理流程；底层不新增一套音乐任务队列。</p>
<p>音乐订阅在订阅页面中单独显示，可从音乐搜索结果或音乐详情直接创建。订阅站点必须已经配置有效 Cookie，并且 V3 站点索引中存在音乐分类或音乐专用类型。</p>
<blockquote class="is-info">
<p>音乐订阅只负责自动检索、下载和整理，不负责歌单管理、歌手库维护或媒体服务器内的播放状态同步。</p>
</blockquote>
<h1 id="洗版" class="toc-header"><a class="toc-anchor" href="#洗版">¶</a> 洗版</h1>
<p>订阅开启洗版后，匹配到资源并成功下载后订阅<strong>不会自动删除</strong>，匹配到比之前下载的资源更高优先级的资源会会继续下载，直到下载到了<code>洗版优先级</code>中优先级最高的资源为止。</p>
<ul>
<li>对于剧集，只有完结状态的剧集才支持洗版。</li>
<li><strong>洗版需要与整理覆盖模式设置配合</strong>，在 <code>设定 -&gt; 目录 -&gt; 整理模式</code>中将<code>覆盖模式</code>调整为<code>总是覆盖</code>或<code>仅保留最新版本</code>，或者修改文件重命名规则，在整理后的文件命名中加入可以区分资源质量的要素，才能实现洗版资源共存或只保留最新下载资源。</li>
</ul>
<h1 id="订阅站点" class="toc-header"><a class="toc-anchor" href="#订阅站点">¶</a> 订阅站点</h1>
<ul>
<li>在 <code>设定 -&gt; 订阅 -&gt; 订阅站点</code> 中设定全局订阅站点范围。</li>
<li><code>编辑订阅</code>可设定具体某个订阅的订阅站点范围。</li>
</ul>
<h1 id="订阅刷新" class="toc-header"><a class="toc-anchor" href="#订阅刷新">¶</a> 订阅刷新</h1>
<p>添加订阅后，系统在3分钟内会进行一次全订阅站点的搜索，以下载目前已出的存量资源，对于未下载完整的则进入<code>订阅刷新</code>环节。</p>
<p><code>订阅刷新</code>会定期通过后台任务的方式检查各站点新出的资源，对这些资源进行逐个识别匹配，并将结果缓存起来，如有符合订阅的资源则添加下载，每次刷新只处理站点新出现的增量资源数据。</p>
<h3 id="订阅模式" class="toc-header"><a class="toc-anchor" href="#订阅模式">¶</a> 订阅模式</h3>
<p>MoviePilot提供两种订阅模式供选择，在 <code>设定 -&gt; 订阅</code> 中选择使用。</p>
<ul>
<li><code>自动</code>：使用内置的爬虫程序以一定范围的随机时间间隔获取各订阅站点种子列表页数据。每次访问间隔在<code>20-40</code>分钟左右，全天会对站点会产生<code>32</code>次种子列表页访问请求，每天早上<code>7:00</code>开始，32次请求完成后停止工作。<strong>该方式支持站点促销标识、做种数等数据，可用于优先级规则和过滤规则设定。</strong></li>
<li><code>站点RSS</code>：使用站点信息维护中的<code>站点RSS链接</code>，RSS访问时间间隔可自由设置（必须大于5分钟），<strong>该方式不支持资源的促销检测以及做种数判定。</strong></li>
</ul>
<h1 id="订阅搜索" class="toc-header"><a class="toc-anchor" href="#订阅搜索">¶</a> 订阅搜索</h1>
<p>由于站点种子列表首页以及站点RSS均存在条数限制，如果站点资源更新频繁或者订阅刷新周期过长，则可能导致有的资源漏掉了。为了解决这个情况MoviePilot增加了订阅搜索机制，每隔<code>24</code>小时可以对订阅进行一次搜索，以补充下载订阅可能漏掉的资源，可在 <code>设定 -&gt; 订阅</code> 中打开。</p>
<p>为了避免对站点造成压力，<code>订阅搜索</code>功能时间间隔无法调整，如没有出现过漏订阅的问题<strong>建议不要开启</strong>。</p>
<h1 id="远程订阅" class="toc-header"><a class="toc-anchor" href="#远程订阅">¶</a> 远程订阅</h1>
<p>完成<code>微信/Telegram/Slack/SynologyChat/VoceChat</code>任一渠道的通知配置后，MoviePilot就具备了远程交互订阅能力，可以通过消息客户端发送<code>订阅</code> + <code>电影、电视剧名称</code>添加订阅。</p>
<p>未启用智能助手时，也可以通过消息渠道管理音乐订阅：发送<code>音乐 订阅 周杰伦 晴天</code>，从单曲或专辑候选中选择目标后创建订阅；发送<code>音乐 洗版 周杰伦 晴天</code>可创建开启音质洗版的订阅。也支持<code>订阅音乐</code>作为前缀，例如<code>订阅音乐 周杰伦 晴天</code>。</p>
