<p>V3 全新安装不会在启动阶段初始化管理员用户名或密码，也不会把初始密码打印到日志。首次访问 Web 地址时，系统会自动进入初始化页面；输入管理员用户名、密码和确认密码并保存后，才会创建管理员账号。</p>
<p>V1、V2 保持原有行为：</p>
<ul>
<li>如果安装时已设置 <code>SUPERUSER_PASSWORD</code>，或者在 V2 设置向导 / 本地 CLI 初始化向导中填写了管理员密码，则该值就是初始登录密码。</li>
<li>如果未设置，则系统会按对应版本规则生成随机复杂密码，<strong>需要从第一次启动的后台日志文件或终端日志中获取管理员用户初始密码才能登录系统</strong>。</li>
</ul>
<p>登录后可在 <code>设定 -&gt; 用户</code> 中修改密码。</p>
<ul>
<li>V1、V2 的日志文件路径为<code>/config</code>对应映射目录下<code>logs/moviepilot.log</code>文件。</li>
<li>可以通过搜索关键字 <code>超级管理员</code> 快速定位密码位置。</li>
</ul>
<p><img src="/password.gif" alt="password.gif"></p>
<blockquote class="is-danger">
<p>管理员用户不要使用弱密码！如非必要不要暴露到公网。如被盗取管理账号权限，将会导致站点Cookie等敏感数据泄露！</p>
</blockquote>
<h1 id="api_token" class="toc-header"><a class="toc-anchor" href="#api_token">¶</a> API_TOKEN</h1>
<p>为了确保安全，V2版本在每次启动时会检查<code>API_TOKEN</code>是否符合最低安全要求（<strong>16位或以上的复杂字符串</strong>）。若不满足要求，系统将自动生成一个随机<code>API_TOKEN</code>并记录到日志文件中。您可以通过后台日志文件查看详细信息，或者在登录后进入<code>设定-系统-API令牌</code>进行修改。请特别注意，如果在环境变量中设置了<code>API_TOKEN</code>，且该值未满足安全要求，则每次系统启动时都会生成新的随机<code>API_TOKEN</code>，请务必尽快修改。</p>
<ul>
<li>日志文件路径为<code>/config</code>对应映射目录下<code>logs/moviepilot.log</code>文件。</li>
<li>可以通过搜索关键字 <code>API_TOKEN</code> 快速定位相关日志内容。</li>
<li>如果你要在 OpenClaw、Claude Code 等第三方 Agent 工具中接入 MoviePilot，也使用同一个 <code>API_TOKEN</code> 作为 MCP 认证密钥，参考 <a href="/mcp" class="is-internal-link is-valid-page">MCP Server</a>。</li>
</ul>
<h1 id="用户认证" class="toc-header"><a class="toc-anchor" href="#用户认证">¶</a> 用户认证</h1>
<p><strong>为了控制用户数量避免大规范泛滥使用</strong>，MoviePilot引入了PT用户认证机制，你需要有认证站点范围内的账号才能使用软件的资源搜索、订阅及下载功能，出此下策与利益无关，属NAStool一路走来，吸取失败经验的无奈之举。</p>
<p>当前有三种常见配置方式：</p>
<ul>
<li>V1、V2 首次安装时可直接在初始化向导里完成用户站点认证</li>
<li>进入系统后，点击右上角头像菜单中的 <code>用户认证</code></li>
<li>使用环境变量配置 <code>AUTH_SITE</code> 及对应站点参数</li>
</ul>
<p>推荐优先使用前两种方式，因为系统会直接按照当前资源支持情况动态列出可认证站点。环境变量方式仍然适用于自动化部署或批量维护场景，参考 <a href="/configuration" class="is-internal-link is-valid-page">配置参考</a> 中 <code>AUTH_SITE</code> 的说明。</p>
<h1 id="媒体识别" class="toc-header"><a class="toc-anchor" href="#媒体识别">¶</a> 媒体识别</h1>
<p><code>识别</code>就是程序要根据仅有的资源名称想办法知道这是哪部电影或者电视剧，并找到其对应的元数据，这样才能实现自动化订阅和整理的目的，<strong>这也是MoviePilot区别于其它资源搜索下载类管理工具的核心特性</strong>。</p>
<p>对于人类来讲，看到一个很长的资源名称时我们能够很容易就知道这个是什么，但对于程序来说不是这样，程序要知道这个资源具体是什么需要满足两个条件：</p>
<ol>
<li>资源按约定的格式命令，这样程序才能从名称中提出取需要的关键字。</li>
<li>对应的关键字在媒体管理平台有维护对应的元数据，这样程序才能查询出元数据并匹配。</li>
</ol>
<p>MoviePilot根据内置的规则对资源名称进行分析，提取出名称关键字，并按这个关键字去<code>TheMovieDb</code>或<code>豆瓣</code>去查找匹配元数据，正确匹配到数据的情况下这个资源就是识别成功，否则就是识别失败。<strong>对于识别失败的资源，MoviePilot不会进行下载、整理等后续处理。</strong></p>
<p>V1、V2 首次安装向导默认使用 <code>themoviedb</code> 作为识别来源，以减少首次使用时因来源切换导致的识别偏差。V3 首次初始化只负责创建管理员和 API Key，识别来源等完整设置在登录后按需调整。</p>
<p>MoviePilot内置的识别程序针对PT站点资源进行了优化，但实际上并不是所有资源都是规范命名的，特别是<strong>网盘、BT以及动漫类</strong>的资源，除了使用内置的识别规则，目前还有以下方法可以提高识别率：</p>
<ul>
<li><code>自定义识别词</code>：通过人为设置规则对资源标题进行预处理，以达到识别格式要求，具体参考  <a href="/advanced" class="is-internal-link is-valid-page">进阶</a> 章节相关说明。</li>
<li><code>识别增强</code>：比如<code>ChatGPT</code>插件开启增强识别后，可以利用ChatGPT的AI能力协助MoviePilot分析资源名称，补充识别信息，具体参考 <a href="/plugin" class="is-internal-link is-valid-page">插件</a> 章节相关说明。</li>
<li><code>完善元数据</code>：登录 <a href="http://www.themoviedb.org" class="is-external-link">http://www.themoviedb.org</a> 网站，新增元数据，添加别名、译名等，方便自已也方便别人。</li>
</ul>
<blockquote class="is-success">
<p>WEB管理界面右上角<code>捷径 -&gt; 识别</code>可以打开识别测试窗口，快速确定资源名称的识别情况。</p>
</blockquote>
<h1 id="搜索匹配" class="toc-header"><a class="toc-anchor" href="#搜索匹配">¶</a> 搜索匹配</h1>
<p>相对于找到更多的资源，<strong>MoviePilot更倾向于找到更准确的资源</strong>，这个工具的目的是自动化订阅整理，能否自动找到最准确的资源而不会误命中更重要。</p>
<p>所以MoviePilot在默认模式下的搜索和订阅都是会做匹配的，匹配的过程就是根据元数据确定这个资源是不是这个电影或电视剧，<strong>如果不是或者存在可疑这个资源都会被过滤不会使用</strong>，这也是为什么很多人在使用MoviePilot搜索资源时结果比直接在站点搜索更少的原因。</p>
<p>当然，MoviePilot也提供了不匹配直接搜索站点的方式做为手动搜索的补充，具体参考 <a href="/search" class="is-internal-link is-valid-page">搜索</a> 章节说明。</p>
<h1 id="优先级" class="toc-header"><a class="toc-anchor" href="#优先级">¶</a> 优先级</h1>
<p><code>优先级</code>是MoviePilot中的一个核心概念，在很多场景都有优先级的设定，比如<code>站点优先级</code>、<code>目录优先级</code>、<code>过滤规则优先级</code>、<code>分类策略优先级</code>等。</p>
<p>优先级统一遵循以<strong>优先级越小越优先</strong>的规则，程序在使用时会按优先级的顺序依次处理。在界面显示时高优先级的排在前面，可以通过拖动卡片顺序来快速调整优先级。</p>
<ul>
<li><code>站点优先级</code>：站点优先模式下，优先下载排在前面的站点的资源，详情参考 <a href="/site" class="is-internal-link is-valid-page">站点</a> 章节说明。</li>
<li><code>目录优先级</code>：优先匹配排在前面的下载目录以及媒体库目录，匹配到即使用，详情参考 <a href="/download" class="is-internal-link is-valid-page">下载</a> 和 <a href="/reorganize" class="is-internal-link is-valid-page">文件整理</a> 章节说明。</li>
<li><code>过滤规则优先级</code>：按规则优先顺序依次匹配，以匹配通过的第一个规则优先级为该资源的优先级，全部不匹配则资源被过滤，详情参考 <a href="/subscribe" class="is-internal-link is-valid-page">订阅</a> 章节说明。</li>
