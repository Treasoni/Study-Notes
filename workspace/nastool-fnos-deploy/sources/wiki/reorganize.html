N0b3J5Ijp7InJlYWQiOmZhbHNlfSwic291cmNlIjp7InJlYWQiOmZhbHNlfSwicGFnZXMiOnsicmVhZCI6dHJ1ZSwid3JpdGUiOmZhbHNlLCJtYW5hZ2UiOmZhbHNlLCJkZWxldGUiOmZhbHNlLCJzY3JpcHQiOmZhbHNlLCJzdHlsZSI6ZmFsc2V9LCJzeXN0ZW0iOnsibWFuYWdlIjpmYWxzZX19" edit-shortcuts="eyJlZGl0RmFiIjp0cnVlLCJlZGl0TWVudUJhciI6ZmFsc2UsImVkaXRNZW51QnRuIjp0cnVlLCJlZGl0TWVudUV4dGVybmFsQnRuIjp0cnVlLCJlZGl0TWVudUV4dGVybmFsTmFtZSI6IkdpdEh1YiIsImVkaXRNZW51RXh0ZXJuYWxJY29uIjoibWRpLWdpdGh1YiIsImVkaXRNZW51RXh0ZXJuYWxVcmwiOiJodHRwczovL2dpdGh1Yi5jb20vb3JnL3JlcG8vYmxvYi9tYWluL3tmaWxlbmFtZX0ifQ==" filename="reorganize.md"><template slot="contents"><div><tabset><template v-slot:tabs=""><li>V3 音乐整理</li><li>V2版本</li><li>V1版本</li></template><template v-slot:content=""><div class="tabset-panel"><p>V3 将音乐作为与电影、电视剧并列的媒体类型。下载完成后，系统会读取音频标签和实际音频参数，并结合种子名称、文件名、目录以及下载时保存的媒体信息，按音乐重命名格式整理到目标目录。</p><p>以下识别状态和按专辑纠正功能需要配套的 V3 后端与前端。旧后端只返回路径预览时，更新前端不会自动补出识别依据或启用专辑纠正。</p><h3 id="有标签与无标签资源" class="toc-header"><a class="toc-anchor" href="#有标签与无标签资源">¶</a> 有标签与无标签资源</h3><ul>
<li><strong>标签完整可信</strong>：曲名、艺人等必要信息完整且没有明显冲突时，可以直接按标签整理；整理整张专辑时还会核对专辑信息和曲目范围。在线服务暂不可用并不意味着这类资源一定不能整理。标签中的 MusicBrainz ID 本身不代表已经在线确认。</li>
<li><strong>缺少标签或标签不完整</strong>：结合种子主副标题、专辑目录、音频文件名、碟号、曲序、曲目数和时长寻找匹配。同一专辑内的标签可辅助补齐专辑信息，但不会把整包标题当作每首歌曲名。</li>
<li><strong>存在多个接近的版本或证据冲突</strong>：需要核对候选、专辑版本或本地文件。不会单凭文件排序把剩余歌曲依次套入曲目表。</li>
</ul><p>尽量保留 PT 资源原有的专辑目录、<code>CD1</code>/<code>CD2</code> 等碟目录和种子名称。把多个专辑提前摊平到一个目录、删除版本信息，或只保留 <code>01.flac</code> 这样的文件名，会减少可用的识别依据。在线补全依赖已启用的数据源及其覆盖范围；指纹识别也是辅助证据，不能保证所有发行版本都有对应记录。</p><h3 id="目录与多碟资源" class="toc-header"><a class="toc-anchor" href="#目录与多碟资源">¶</a> 目录与多碟资源</h3><p>默认命名结构为：</p><pre class="prismjs line-numbers" v-pre="true"><code class="language-text">专辑艺术家/专辑 (年份)/曲序 - 歌曲.扩展名
专辑艺术家/专辑 (年份)/Disc 碟号/曲序 - 歌曲.扩展名  # 已知多碟专辑
</code></pre><p>在 <code>设定 -&gt; 目录 -&gt; 音乐重命名格式</code> 中可使用 Jinja2 格式调整目录和文件名，常用字段包括 <code>artist</code>、<code>album_artist</code>、<code>album</code>、<code>title</code>、<code>track</code>、<code>disc</code>、<code>disc_number</code>、<code>total_discs</code>、<code>year</code> 和 <code>fileExt</code>。默认先使用专辑艺术家，没有时使用曲目艺人；总碟数大于 1 时才增加碟目录。升级不会替换你已经保存的自定义模板，需要时请自行加入碟号，避免不同碟的同序号歌曲重名。</p><ul>
<li><strong>VA / 合辑 / OST</strong>：保留每首歌的艺人署名，专辑归档使用专辑艺术家等整专证据，不要求所有曲目属于同一个歌手。</li>
<li><strong>歌手全集</strong>：选择全集目录整理时，可使用<code>音乐 -&gt; 艺术家合集</code>，按专辑子目录检查结果；不要把整个全集手动指定成一张专辑。</li>
<li><strong>整轨音频与 CUE</strong>：读取有效 CUE 的专辑及逻辑曲目信息，保留整轨音频和对应索引，不自动切轨。CUE 引用冲突或音频无法读取时，应先修复源资源。</li>
<li><strong>压缩包、SACD 等镜像</strong>：不会自动解包、转换或切轨；需要先用相应工具准备可读取的音频。</li>
<li><strong>远端存储</strong>：无法直接读取音频时会明确显示仅文件名信息，不能当作已经读到标签。当前按具体发行逐曲核对需要本地可读音频，相关纠正入口会禁用。</li>
</ul><p>MoviePilot 只负责下载后的识别、整理和刮削，不建立音乐媒体库、不播放音频，也不负责歌单或歌手库同步。整理完成后请由 Navidrome、Emby、Jellyfin、Plex 等媒体服务器扫描目标目录。</p><h3 id="整理与刮削-保种的关系" class="toc-header"><a class="toc-anchor" href="#整理与刮削-保种的关系">¶</a> 整理与刮削、保种的关系</h3><p>音乐整理会处理匹配的 CUE 及与音轨同目录、同主干名的 <code>.lrc</code>、<code>.txt</code> 和 <code>.lyricsfile.yaml</code>。启用音乐刮削后可写入目标文件的标签和封面，并按“质量升级”策略读取内嵌歌词、查询在线来源和生成旁挂歌词；已有同步歌词不会被纯文本降级覆盖。</p><blockquote class="is-info">
<p>新版音乐标签/封面写入会保护链接指向的源音频：目标为硬链接或软链接时，先在独立副本中完成修改，成功后替换媒体库中的目标入口。下载目录中的源文件内容保持不变；发生实际写入后，媒体库文件会占用独立空间。没有标签或封面变化时保留原链接。复制失败、空间不足或写入失败会保留原链接并报告错误。此保护针对 MoviePilot 的音乐写入流程；其他软件直接修改硬链接内容仍会影响做种文件。</p>
</blockquote><p>仍在做种时优先使用合适的链接或复制方式；<code>移动</code>会改变源文件位置。只想整理文件名和目录时可以关闭<code>刮削元数据</code>。</p><h3 id="预览识别依据与纠正版本" class="toc-header"><a class="toc-anchor" href="#预览识别依据与纠正版本">¶</a> 预览识别依据与纠正版本</h3><ol>
<li>在<code>文件管理</code>中选择专辑目录或音频文件，打开整理；也可从失败的整理历史进入重新整理。点击<code>预览</code>，先核对目标路径和每组文件。</li>
<li>识别状态与文件结果分别查看。<code>本地标签</code>、<code>CUE 信息</code>表示使用本地证据；<code>在线匹配</code>表示已核验在线身份；<code>人工选择</code>表示使用了指定身份。<code>已有媒体信息</code>不等同于在线确认。即使识别信息可用，也可能因目标分类、覆盖策略或文件操作失败而不能入库，应同时看每项错误。</li>
<li>对<code>候选待确认</code>、<code>信息冲突</code>或版本不对的专辑，点击该组的<code>纠正专辑 / 版本</code>。选择音乐数据源并搜索专辑，核对艺人和曲目表。</li>
<li>使用 MusicBrainz 时，在<code>具体发行版本</code>中核对日期、地区、介质和曲目数。列表没有目标版本时，展开<code>未找到所需发行版？</code>，粘贴具体 <strong>Release UUID</strong> 并读取曲目。Release、Release Group 和 Recording 是不同身份，不能互换；无法读取或不属于该专辑的发行不能应用。</li>
<li>点击<code>应用并重新预览</code>，检查逐曲对位和目标路径。确认后再<code>立即整理</code>或<code>加入整理队列</code>；入队表示请求已接收，实际结果以队列和整理历史为准。</li>
</ol><p>纠正只处理该组已经预览过的源文件，配套文件一并保留。保存纠正后，本次执行的全部范围固定为预览中的文件，不会重新扫描父目录并带入后来新增的专辑。修改全局选项或源文件选择会使纠正失效，需要重新预览和核对；折叠预览面板不会丢失选择。仍有未通过预览的文件时，请完成处理后再执行。</p><table>
<thead>
<tr>
<th>预览提示</th>
<th>建议处理</th>
</tr>
</thead>
<tbody>
<tr>
<td>未找到匹配 / 候选待确认</td>
<td>保留完整专辑范围和版本信息，检查标签、曲序及曲目数，必要时手选专辑和发行版</td>
</tr>
<tr>
<td>信息冲突</td>
<td>核对标签、种子或目录名称是否指向不同专辑，检查是否混入其他发行的曲目</td>
</tr>
<tr>
<td>识别服务暂不可用 / 本次查询额度已用完</td>
<td>检查来源连通性，稍后重试；这不代表资源永久无法识别，无需反复批量提交</td>
</tr>
<tr>
<td>音频无法读取</td>
<td>确认下载完成、文件内容与扩展名一致、文件未损坏，以及 MoviePilot 有读取权限</td>
</tr>
<tr>
<td>仅文件名信息 / 此组暂不可纠正</td>
<td>检查远端存储或预览范围，必要时下载到本地后重新预览；旧服务也可能缺少完整文件范围</td>
</tr>
<tr>
<td>暂不支持整理</td>
<td>先解包或转换为支持的音频资源，再重新选择文件</td>
</tr>
</tbody>
</table></div><div class="tabset-panel"><p>MoviePilot V2版本支持按目录设定是否通过下载器监控整理或者目录监控整理，内建集成了目录监控功能，无需安装第三方插件。</p><ul>
<li>下载器监控自动整理间隔为 <code>5分钟</code>，设定中所有启用的下载器且设定了对应目录时都会自动整理。</li>
<li>目录监控为实时。请避免对网盘目录使用目录监控，容易触发大量API请求导致被流控。</li>
</ul></div><div class="tabset-panel"><h3 id="下载器监控" class="toc-header"><a class="toc-anchor" href="#下载器监控">¶</a> 下载器监控</h3><p>MoviePilot V1通过<strong>监测下载器中的下载任务状态</strong>来实现自动整理已下载的文件，通过<code>设定 -&gt; 连接 -&gt; 下载器</code> 打开 <code>下载文件自动整理</code> 开关开启自动整理功能。</p><ul>
<li><strong>自动整理定时检查时间隔间为<code>5分钟</code></strong>。</li>
<li>如启用了多个下载器，<strong>默认只会监控整理第1个下载器的下载任务</strong>。</li>
<li>如果设定了<code>下载器种子标签</code>，则只有下载器中有对应标签的下载任务才会被自动整理。</li>
</ul><h3 id="目录监控" class="toc-header"><a class="toc-anchor" href="#目录监控">¶</a> 目录监控</h3><p>对于非MoviePilot添加的下载任务，插件市场中提供了<code>目录监控</code>等插件实现自动监测和整理，这类插件通过监测文件变化来实现自动整理，<strong>注意参照 <a href="/ready" class="is-internal-link is-valid-page">环境准备</a> 中操作系统章节说明调整文件系统参数，同时需要打开下载器的<code>为不完整文件添加扩展名</code>选项，以避免文件在下载中就被自动转移了。</strong></p><blockquote class="is-warning">
<p>建议通过MoviePilot下载的内容优先使用内建的<strong>下载文件自动整理</strong>实现自动整理，基于监控目录整理等仅是插件提供的功能，非推荐整理方式。</p>
</blockquote></div></template></tabset>
<blockquote class="is-info">
<p>如果使用<code>Qbittorrent</code>做为下载器，可在 QB设置-&gt;下载完成时运行外部程序 处填入：curl "<a href="http://localhost:3000/api/v1/transfer/now?token=moviepilot" class="is-external-link">http://localhost:3000/api/v1/transfer/now?token=moviepilot</a>" ，实现无需等待轮循下载完成后立即整理入库（地址、端口和token按实际调整，curl也可更换为wget）。</p>
</blockquote>






























<h1 id="文件整理方式" class="toc-header"><a class="toc-anchor" href="#文件整理方式">¶</a> 文件整理方式</h1>
<p>根据磁盘结构、空间大小、保种需要等综合决定使用哪种文件整理方式，在<code>设定 -&gt; 目录 -&gt; 整理模式</code> 中调整。</p>
<ul>
<li><strong>硬链接</strong>：一份文件生成多个文件入口，但只占用一份存储空间，只有所有入口都删除后才能释放文件占用空间；可以修改硬链接后的文件名但不会影响原文件做种（不能修改文件内容）；<strong>要求在同一磁盘/存储空间/映射路径下才能硬链接。</strong></li>
<li><strong>软链接</strong>：类似于快捷方式，原文件删除后软链接即会失效；使用软链接时的原文件路径需要与生成软链接时的原文件路径保持一致，否则无法使用，也就是在docker环境下，映射前后的目录路径需要一致。</li>
<li><strong>复制</strong>：复制一份副本，多占用一份空间。</li>
<li><strong>移动</strong>：移动文件存储位置，会影响原文件做种。</li>
<li><strong>Rclone复制</strong>：使用Rclone复制本地文件到网盘，需要自行映射rclone配置目录到容器中（<code>/moviepilot/.config/rclone</code>）或在容器内使用<code>rclone config</code>完成rclone配置，网盘配置名称必须为：<code>MP</code>，可自行通过Docker添加环境变量传递参数优化传输，参考：<a href="https://rclone.org/docs/#environment-variables" class="is-external-link">https://rclone.org/docs/#environment-variables</a> 。</li>
<li><strong>Rclone移动</strong>：使用Rclone移动本地文件到网盘，其余与Rclone复制一致。</li>
</ul>
<h1 id="文件覆盖方式" class="toc-header"><a class="toc-anchor" href="#文件覆盖方式">¶</a> 文件覆盖方式</h1>
<p>在 <code>设定 -&gt; 目录 -&gt; 整理模式</code> 中调整媒体库已存在同名文件（后缀名也相同）时对应的处理策略：</p>
<ul>
<li><code>从不覆盖</code>：当媒体库中存在同名文件时中断整理，历史记录中将产生错误的整理记录。</li>
<li><code>按大小覆盖</code>：当下载文件比媒体库中已有文件更大时覆盖已有文件，否则中断整理并在历史记录中将产生错误的整理记录。</li>
<li><code>总是覆盖</code>：直接使用下载的文件覆盖媒体库中的同名文件。</li>
<li><code>仅保留最新版本</code>：同一个电影或者电视剧剧集，<strong>删除媒体库中的其它版本文件（包括文件名不一致的）</strong>，仅保留下载整理的最新版本。</li>
</ul>
<h1 id="手动整理文件" class="toc-header"><a class="toc-anchor" href="#手动整理文件">¶</a> 手动整理文件</h1>
<ul>
<li>文件自动整理失败时，将会产生失败记录，可在<code>历史记录</code>中手动进行整理。</li>
<li>通过<code>文件管理</code>功能浏览文件系统，对整个目录或者某个文件进行手动整理。</li>
<li>整理整张音乐专辑时，可在<code>文件管理</code>中对专辑目录直接点击整理，或进入多选模式勾选该目录；类型选择<code>音乐</code>后会默认使用<code>专辑</code>实体，单个音频文件则默认使用<code>单曲</code>实体。</li>
</ul>
<p>如涉及需要同时整理多个相似文件（比如一部剧有多集），参见 <a href="/advanced" class="is-internal-link is-valid-page">进阶</a> 批量手动整理章节。</p>
<h1 id="历史记录中的重新整理" class="toc-header"><a class="toc-anchor" href="#历史记录中的重新整理">¶</a> 历史记录中的重新整理</h1>
<p><code>历史记录 -&gt; 整理历史</code> 中的单条记录当前通常有两类重新处理方式：</p>
<ul>
<li><code>重新整理</code>
<ul>
<li>适合你已经知道正确媒体信息、目标目录或存储位置的场景</li>
<li>本质上仍是手工修正后再次执行整理</li>
</ul>
</li>
<li><code>智能助手整理</code>
<ul>
<li>适合失败原因较复杂、需要结合上下文重新判断的场景</li>
<li>会调用智能助手与系统工具重新分析该条整理记录</li>
</ul>
</li>
</ul>
<h2 id="智能助手整理" class="toc-header"><a class="toc-anchor" href="#智能助手整理">¶</a> 智能助手整理</h2>
<p>使用前提：</p>
<ul>
<li>已正确配置智能助手</li>
<li>已打开 <code>AI_AGENT_ENABLE</code></li>
</ul>
<p>执行特点：</p>
<ul>
<li>针对单条整理记录发起任务</li>
<li>处理过程通过实时滚动文本显示进度</li>
<li>完成后会自动刷新历史记录列表</li>
<li>如果智能助手未启用，该入口会被禁用</li>
</ul>
<blockquote class="is-success">
<p><code>智能助手整理</code> 是独立的后端接口，不是简单包装传统 <code>/redo</code> 命令。</p>
</blockquote>
<h2 id="redo-命令" class="toc-header"><a class="toc-anchor" href="#redo-命令">¶</a> /redo 命令</h2>
<p>对于习惯命令方式处理问题的用户，仍然可以通过消息渠道使用：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-text">/redo [id]
/redo [id] [media_source]|[media_id]|[类型]
</code></pre>
<p>适合：</p>
<ul>
<li>你已经知道正确的媒体来源和该来源的原生 ID</li>
<li>想直接指定电影 / 电视剧类型</li>
<li>需要在远程消息渠道中快速处理单条失败记录</li>
</ul>
<p>如果并不确定该如何修正，优先尝试 <code>智能助手整理</code> 往往更省事。</p>
