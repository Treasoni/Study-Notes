<blockquote class="is-warning">

<h2 id="v3-资源索引" class="toc-header"><a class="toc-anchor" href="#v3-资源索引">¶</a> V3 资源索引</h2>
<blockquote class="is-info">
<p>不再持续更新，请在MoviePilot <code>设定</code> -&gt; <code>关于</code> 中查看最新支持的站点。</p>
</blockquote>
<p>V3 使用独立的站点资源目录和索引包：</p>
<ul>
<li>资源目录：<code>resources.v3</code></li>
<li>站点索引包：<code>user.sites.v3.bin</code></li>
<li>索引版本：<code>3.0.0</code></li>
</ul>
<p>V3 不会回退到 V2 站点资源。遇到站点分类无法识别时，先确认运行实例已经加载 V3 资源，再检查 Cookie 和站点页面是否发生变化。</p>
<h3 id="音乐分支" class="toc-header"><a class="toc-anchor" href="#音乐分支">¶</a> 音乐分支</h3>
<p>V3 除了音乐专用站点，也支持影视综合站中的音乐分支。当前索引已覆盖憨憨、观众、听听歌、春天、家园、天空、NovaHD、学校、麒麟、天雪、烧包乐园、自由农场、CARPT、红豆饭、冬樱、UBits、蟹黄堡、库非、PTLGS、AGSVPT、浦园 PT、彩虹岛、咖啡、下水道和我的 PT 等站点的音乐分类；实际可用站点以实例当前加载的资源和站点登录状态为准。</p>
<p>音乐搜索会使用站点索引中的 <code>music</code> 分类。对于使用父分类参数或独立搜索页面的站点，参数由 V3 索引自动生成，用户不需要手工拼接分类 URL。</p>
<ul>
<li>
<p><strong>私有站点：</strong><br>
<code>北邮人</code>、<code>萝莉</code>、<code>白兔</code>、<code>我堡</code>、<code>GTK</code>、<code>海棠</code>、<code>梓喵</code>、<code>聆音</code>、<code>库非</code>、<code>杏坛</code>、<code>红叶PT</code>、<code>UBits</code>、<code>高清杜比</code>、<code>PTFans</code>、<code>朋友</code>、<code>柠檬</code>、<code>雨</code>、<code>蟹黄堡</code>、<code>大青虫</code>、<code>铂金家</code>、<code>HDFun</code>、<code>艾薇</code>、<code>铂金学院</code>、<code>AFUN</code>、<code>红豆包</code>、<code>猪猪</code>、<code>小蚂蚁</code>、<code>织梦</code>、<code>花梨月下</code>、<code>OshenPT</code>、<code>冬樱</code>、<code>憨憨</code>、<code>CARPT</code>、<code>鲨鱼</code>、<code>HDVBits</code>、<code>丐帮</code>、<code>青蛙</code>、<code>熊猫高清</code>、<code>咖啡</code>、<code>iHDBits</code>、<code>百川</code>、<code>蝶粉</code>、<code>FileList</code>、<code>回声PT</code>、<code>好多油</code>、<code>PT时间</code>、<code>ultrahd</code>、<code>唐门</code>、<code>HDVIDEO</code>、<code>AGSVPT</code>、<code>ToSky</code>、<code>朱雀</code>、<code>北洋园</code>、<code>明教</code>、<code>兽站</code>、<code>JPTV</code>、<code>彩虹岛</code>、<code>PTzone</code>、<code>Sunny</code>、<code>老师</code>、<code>家园</code>、<code>莫妮卡</code>、<code>麒麟</code>、<code>1PTBA</code>、<code>听听歌</code>、<code>学校</code>、<code>CinemaGeddon</code>、<code>TorrentLeech</code>、<code>象站</code>、<code>HDClone</code>、<code>天空</code>、<code>星空</code>、<code>52pt</code>、<code>财神</code>、<code>星陨阁</code>、<code>IPT</code>、<code>城市</code>、<code>葡萄</code>、<code>海胆之家</code>、<code>红豆饭</code>、<code>南洋</code>、<code>Uploads</code>、<code>伊甸园</code>、<code>备胎</code>、<code>PTLSP</code>、<code>打胶</code>、<code>馒头</code>、<code>下水道</code>、<code>吐鲁番</code>、<code>高清时间</code>、<code>2xFree</code>、<code>春天</code>、<code>观众</code>、<code>皇后</code>、<code>龙之家</code>、<code>瓷器</code>、<code>蝴蝶</code>、<code>PTLGS</code>、<code>幼儿园</code>、<code>浦园PT</code>、<code>YemaPT</code>、<code>阿童木</code>、<code>自由农场</code>、<code>高清视界</code>、<code>开心</code>、<code>他吹吹风</code>、<code>冰淇淋</code>、<code>天雪</code>、<code>烧包乐园</code>、<code>Rousi</code>、<code>OKPT</code>、<code>猫站</code>、<code>PlayLet</code>、<code>我的PT</code>、<code>13City</code> 、<code>NovaHD</code></p>
</li>
<li>
<p><strong>公开站点：</strong><br>
<code>Nyaa</code>、<code>TorrentGalaxy</code>、<code>ACG.RIP</code>、<code>MiKan</code>、<code>动漫花园</code>、<code>AniBT</code></p>
</li>
</ul>
<h3 id="anibt" class="toc-header"><a class="toc-anchor" href="#anibt">¶</a> AniBT</h3>
<p>AniBT 的公开接口无需站点 Cookie 或 API Key；MoviePilot 自身的用户认证要求仍然适用。<br>
在站点管理中添加 <code>https://anibt.net/</code>，启用搜索和订阅即可参与资源匹配与下载。</p>
<p>AniBT 旧网页索引已失效。V3 站点索引资源 <code>3.0.17</code> 起改用公开 RSS 的关键词查询，<br>
并保留音乐搜索入口。后端需要包含 <a href="https://github.com/jxxghp/MoviePilot/pull/6872" class="is-external-link">RSS 索引兼容修复</a>，<br>
使索引解析器支持 RSS 的 XML 编码声明。<br>
在 <code>设定 -&gt; 关于</code> 中核对已加载的站点资源版本；只有更新资源而未更新后端时，仍可能搜索失败。</p>
<p>使用「站点RSS」订阅模式时，可在该站点的 RSS 地址中填写：</p>
<ul>
<li>全站最新番剧：<code>https://anibt.net/rss/magnets.xml</code></li>
<li>指定番剧：<code>https://anibt.net/rss/anime.xml?bgmId=&lt;Bangumi条目ID&gt;</code></li>
<li>指定番剧及字幕组：在上一地址追加 <code>&amp;groupSlug=&lt;字幕组slug&gt;</code></li>
</ul>
<p>指定番剧或字幕组的 RSS 会限制这个站点刷新时能看到的资源范围。订阅设置仍需选择 AniBT，<br>
下载结果继续遵守 MoviePilot 的媒体识别、缺集和过滤规则。不要把 <code>bgmId</code> 当作 TMDB ID。<br>
RSS 最多返回 100 条资源，建议启用订阅搜索补漏；接口未提供的做种数不能用来判断资源活跃度。</p>
<p>公开接口及筛选参数见 <a href="https://wiki.anibt.net/docs/open-api/rss-magnets" class="is-external-link">AniBT RSS 文档</a><br>
和 <a href="https://wiki.anibt.net/docs/open-api/rss-anime" class="is-external-link">番剧 RSS 文档</a>。</p>
<h2 id="用户认证" class="toc-header"><a class="toc-anchor" href="#用户认证">¶</a> 用户认证</h2>
<p>参考  <a href="/configuration" class="is-internal-link is-valid-page">认证站点</a> 说明。</p>
<h1 id="手动添加编辑站点" class="toc-header"><a class="toc-anchor" href="#手动添加编辑站点">¶</a> 手动添加/编辑站点</h1>
<p>如果你的站点比较少，可以通过手动添加站点的方式逐个添加到系统中，点击<code>站点管理</code>右下角<code>+</code>图标添加站点。</p>
<ul>
<li><code>站点地址</code>：站点访问的域名地址，需要在支持站点清单中。</li>
<li><code>优先级</code>：站点优先级用于搜索时的站点排序，数值越小优先级越高，也可以添加站点后拖动卡片调整优先级顺序。</li>
<li><code>RSS地址</code>：点击站点的<code>RSS</code>按钮，选择影视相关分类，条数选最大，复制生成的<strong>BT客户端使用的RSS链接地址</strong>填入。<strong>当你设定的订阅模式是"站点RSS"时，系统会通过该地址获取站点资源。</strong></li>
<li><code>超时时间</code>：搜索站点资源时，等待站点返回的最大时间。如果站点连通性较好，建议设置为较小的值，比如<code>10</code>，如果站点日常响应较大，建议设置为较大的值比如<code>30</code>。该值设置较大时如果站点无法连接，将会增加搜索耗时时间。</li>
<li><code>站点Cookie</code>：登录站点后打开浏览器的<code>开发者工具</code>，在网络选项卡中选中主页面请求，找到请求头中的<code>Cookie</code>值填入。</li>
<li><code>请求头（Authorization）</code>：个别站点不使用Cookie，则需要获取访问站点时请求头中的<code>Authorization</code>值填入，与站点Cookie获取方法一致，已知站点：<code>馒头</code>。</li>
<li><code>令牌（API Key）</code>：个别站点通过API Key实现访问控制，需要在站点个人中心中生成令牌后填入，已知站点：<code>馒头</code>。</li>
<li><code>站点User-Agent</code>：获取<code>站点Cookie</code>时使用的浏览器标识，获取站点Cookie的同时找到<code>User-Agent</code>填入，<strong>填写Cookie配套的User-Agent有助于程序跳过站点的Cloudflare人机验证，增加连接成功率</strong>，建议填写。</li>
<li><code>站点流控</code>：通过设定单位周期内站点的访问次数以及访问间隔来控制站点的访问频率，避免对站点造成过大压力，根据站点实际需要配置。</li>
<li><code>代理</code>：站点是否使用已配置的代理服务器连接，开启后会有图标显示，需要配置<code>PROXY_HOST</code>代理服务器，参考 <a href="/configuration" class="is-internal-link is-valid-page">配置参考</a> 说明。</li>
<li><code>浏览器仿真</code>：站点是否使用浏览器仿真访问，适用于人机验证机制较严格的站点使用，会减慢站点的访问速度，同时占用更多系统资源。<strong>需要正常下载浏览器内核环境后才能使用。</strong></li>
</ul>
<h1 id="快速添加站点" class="toc-header"><a class="toc-anchor" href="#快速添加站点">¶</a> 快速添加站点</h1>
<p>更推荐使用CookieCloud批量将日常使用的浏览器中的Cookie批量同步到MoviePilot中，同时定时更新保证站点的正常访问。</p>
<ol>
<li>在浏览器中安装设置好 CookieCloud 插件，登录站点后通过插件同步浏览器Cookie数据到CookieCloud服务端。</li>
<li>在MoviePilot<code>设定 -&gt; 站点</code>中维护好相关参数并开启CookieCloud同步，其中CookieCloud服务器可以使用本地服务或远端服务，与浏览器插件中的地址保持一致即可。</li>
<li><code>设定 -&gt; 服务</code> 中运行一次<code>同步CookieCloud站点</code>服务，此时会自动添加站点、生成站点RSS链接和站点图标。</li>
</ol>
<h1 id="更新站点cookie" class="toc-header"><a class="toc-anchor" href="#更新站点cookie">¶</a> 更新站点Cookie</h1>
<p>点击站点卡片<code>更新</code>按钮，可通过输入站点<code>用户名</code>和<code>密码</code>，让系统自动模拟登录站点获取Cookie，从而省去人工操作。同样需要正常下载浏览器内核的环境，同时配置了OCR服务器才能使用。</p>
<p>实际上受站点人机验证、登录验证码识别等原因，并不是100%成功，如多次重试无法获取，仍需要手工登录获取Cookie。</p>
<h1 id="站点连接状态" class="toc-header"><a class="toc-anchor" href="#站点连接状态">¶</a> 站点连接状态</h1>
<p>站点卡片右上解图标代表站点近期的连接状态：</p>
<ul>
<li><code>绿色</code>：站点连接正常，且响应较快</li>
<li><code>黄色</code>：站点能连通，但平均耗时大于5秒，响应较慢</li>
<li><code>红色</code>：站点无法连接，或者连接超时</li>
</ul>
<h1 id="站点优先级" class="toc-header"><a class="toc-anchor" href="#站点优先级">¶</a> 站点优先级</h1>
<p>站点的展示顺序同时代表站点优先级。</p>
<p><strong>V1版本：</strong> <code>设定 -&gt; 站点 -&gt; 下载优先规则</code>中设置为<code>站点优先</code>时，站点优先级将影响搜索结果排序和下载，数值越小优先级越高，可通过拖动卡片调整优先级顺序。</p>
<p><strong>V2版本：</strong> <code>设定 -&gt; 规划 -&gt; 下载规则</code> 中选定<code>站点优先级</code> 时，站点的优先顺序将会影响选择资源下载的策略</p>
<p><strong>V3版本：</strong> 站点优先级继续参与资源选择，同时音乐站点分类也会参与媒体类型过滤。搜索音乐时，只有站点索引声明了音乐分类或音乐专用类型的站点会返回音乐资源。</p>
