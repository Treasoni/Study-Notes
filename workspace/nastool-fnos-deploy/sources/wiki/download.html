<p>在<code>设定</code>中添加下载目录配置。如果你是使用docker环境部署，下载目录对应的根目录需要映射到容器中，否则下载文件会存储到容器内导致容器异常。</p>
<p><strong>下载目录需要与下载器使用的目录一致</strong>，如使用docker可通过映射路径时转换成一致。</p>
<p>更多参见 <a href="/advanced" class="is-internal-link is-valid-page">进阶</a> 多目录支持与分类章节。</p>
<h1 id="手动下载" class="toc-header"><a class="toc-anchor" href="#手动下载">¶</a> 手动下载</h1>
<ul>
<li>手动下载时需要识别资源才能进行下载。</li>
<li>下载目录无法在手动下载时指定，而是由系统识别资源后自动判定。</li>
</ul>
<h2 id="v3-音乐下载" class="toc-header"><a class="toc-anchor" href="#v3-音乐下载">¶</a> V3 音乐下载</h2>
<p>V3 音乐下载复用现有下载器和下载任务流程：在音乐搜索结果中选择站点资源后提交下载，下载完成后由文件整理流程识别音频并按音乐目录规则整理。</p>
<p>音乐下载不会创建 MoviePilot 内置音乐库。请先在 <code>设定 -&gt; 目录</code> 配置音乐目标目录，并确认下载器路径与 MoviePilot 的目录映射一致；整理后的文件由外部媒体服务器负责扫描和播放。</p>
<h1 id="远程下载" class="toc-header"><a class="toc-anchor" href="#远程下载">¶</a> 远程下载</h1>
<p>完成<code>微信/Telegram/Slack/SynologyChat/VoceChat</code>任一渠道的通知配置后，MoviePilot就具备了远程交互下载能力，可以通过消息客户端发送电影、电视剧名称搜索和下载。未启用智能助手时，也可以用以下格式发起音乐交互：</p>
<ul>
<li><code>音乐 搜索 周杰伦 晴天</code> 或 <code>搜歌 周杰伦 晴天</code>：选择单曲或专辑后搜索对应站点资源。</li>
<li><code>音乐 下载 周杰伦 晴天</code>：即使音乐已在媒体库中，也可选择音乐结果继续搜索资源。</li>
</ul>
<p>音乐候选会标明单曲或专辑、艺术家及专辑信息；按提示回复编号，或使用渠道提供的按钮继续选择。</p>
<p>V1版本通过维护变量<code>AUTO_DOWNLOAD_USER</code>来设定远程搜索时是自动择优下载还是发送资源列表让用户选择，V2版本可以直接在界面中调整设置。</p>
<p>如果同时已启用智能助手，则这些消息入口还可以继续承担智能助手远程交互能力，例如发送文本、图片、文件或语音消息进一步分析问题。参考 <a href="/notification" class="is-internal-link is-valid-page">通知</a> 与 <a href="/agent" class="is-internal-link is-valid-page">智能助手</a>。</p>
