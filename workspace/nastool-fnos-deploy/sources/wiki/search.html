<p>WEB管理页面点击搜索图标或者按 <code>ctrl+K</code>/<code>command+k</code> 弹出聚合搜索窗口，输入关键字后可选择搜索媒体信息或人物。</p>
<p><code>设定 -&gt; 搜索 -&gt; 媒体数据源</code>可设置搜索展示的媒体信息源，且按设置选择的先后顺序排序。</p>
<h1 id="搜索资源" class="toc-header"><a class="toc-anchor" href="#搜索资源">¶</a> 搜索资源</h1>
<ol>
<li>
<p>通过 <code>设定 -&gt; 搜索 -&gt; 搜索站点</code> 设定搜索时使用的站点范围，站点选择越多搜索速度会越慢。</p>
</li>
<li>
<p>通过 <code>设定 -&gt; 搜索 -&gt; 过滤规则</code> 全局设定需要过滤的资源类型，避免搜索到不想到的数据。比如我没有杜比播放设备，则在<code>默认过滤规则</code>中可以设定排除：<code>Dolby[\s.]+Vision|DOVI|[\s.]+DV[\s.]+|杜比视界</code>，这样所有搜索情况下都不会出现杜比视界的资源。可与搜索优先级配合使用。</p>
</li>
<li>
<p>V3 会优先使用流式搜索结果页：搜索开始后页面会持续展示搜索进度、当前关键字与实时结果预览，而不是整页空白等待全部站点返回。</p>
</li>
</ol>
<h2 id="音乐搜索" class="toc-header"><a class="toc-anchor" href="#音乐搜索">¶</a> 音乐搜索</h2>
<p>V3 在聚合搜索中增加“音乐”入口，支持按歌曲、专辑或艺术家搜索 MusicBrainz 元数据。选择音乐结果后，可以继续搜索站点资源、提交下载或创建音乐订阅。</p>
<p>音乐资源搜索会向选定站点提交音乐分类。部分站点是影视综合站，但存在无损音乐、唱片或演唱会分支，V3 会按站点索引中的音乐分类选择对应分支；不需要把站点单独维护成音乐专站。</p>
<p>音乐搜索使用与电影、电视剧相同的站点 Cookie、User-Agent、代理和限流配置。站点配置方法参见 <a href="/site" class="is-internal-link is-valid-page">站点</a>。</p>
<blockquote class="is-info">
<p>MoviePilot 的音乐流程负责搜索、下载和整理，不提供音乐播放或内置音乐库。媒体库和播放请使用 Navidrome、Emby、Jellyfin、Plex 等现成软件。</p>
</blockquote>
<h3 id="精确搜索" class="toc-header"><a class="toc-anchor" href="#精确搜索">¶</a> 精确搜索</h3>
<p>搜索媒体信息后，点击卡片中的搜索图标，或者进入媒体详情页面后点击搜索，此时为<code>精确匹配</code>的搜索，结果只包含对应媒体信息的资源。</p>
<p>精确搜索前需要先识别媒体信息，假如当前设置的媒体信息识别源与当前浏览的媒体信息展示来源不一致，则会有转换匹配的过程，<strong>有时候因为TheMoiveDb与豆瓣、Bangumi等渠道的名称、年份等数据不一致，转换可能会不一致导致无法搜索。</strong> 如遇这种情况，建议重新搜索媒体信息，选择与识别源一致的数据源浏览。</p>
<h3 id="模糊搜索" class="toc-header"><a class="toc-anchor" href="#模糊搜索">¶</a> 模糊搜索</h3>
<p>在聚合搜索窗口，选择搜索<code>站点资源</code>，此时为<code>模糊搜索</code>结果，直接展示站点搜索返回的数据，不经过过滤规则、优先级规则等处理。</p>
<h1 id="流式搜索体验" class="toc-header"><a class="toc-anchor" href="#流式搜索体验">¶</a> 流式搜索体验</h1>
<p>V3 的资源搜索页在搜索过程中会保持页面可交互，并实时更新搜索状态：</p>
<ul>
<li>顶部会显示当前进度文案，而不是只有一个空白加载框</li>
<li>搜索进行中时，会先展示预览结果与实时数量</li>
<li>搜索完成后，再切换回完整结果、筛选条和结果统计</li>
<li>如果浏览器或代理环境不支持流式连接，会自动回退到普通请求搜索</li>
</ul>
<blockquote class="is-info">
<p>如果你开启了反向代理，建议给代理连接预留更长超时时间，并开启 <code>http2</code>，避免流式搜索或日志请求被代理提前中断。</p>
</blockquote>
<h1 id="ai-智能推荐" class="toc-header"><a class="toc-anchor" href="#ai-智能推荐">¶</a> AI 智能推荐</h1>
<p>当系统已配置智能助手，并打开 <code>AI_RECOMMEND_ENABLED</code> 后，资源搜索结果页支持 <code>AI智能推荐</code>。</p>
<p>使用方式：</p>
<ul>
<li>先完成一次普通资源搜索</li>
<li>按需使用筛选器缩小范围</li>
<li>再执行 <code>AI智能推荐</code>，让智能助手对当前结果做进一步筛选和排序</li>
</ul>
<p>当前行为特点：</p>
<ul>
<li>推荐基于当前搜索结果进行，不会替代原始站点搜索</li>
<li>从 <code>原始结果</code> 切换到 <code>AI推荐结果</code> 时，会自动保存当前筛选条件</li>
<li>再切换回 <code>原始结果</code> 时，会自动恢复原先的筛选条件</li>
</ul>
<p>智能助手配置方法参考 <a href="/agent" class="is-internal-link is-valid-page">智能助手</a> 与 <a href="/configuration" class="is-internal-link is-valid-page">配置参考</a>。</p>
