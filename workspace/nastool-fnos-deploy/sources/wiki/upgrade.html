<h2 id="v3-切换说明" class="toc-header"><a class="toc-anchor" href="#v3-切换说明">¶</a> V3 切换说明</h2>
<p>V3 是独立主版本，但兼容 V2 的配置和数据库数据；未使用 V3 变更合同的插件可直接复用，需要适配的插件应安装开发者提供的 V3 专用版本。从 V2 切换到 V3 不需要迁移用户数据，继续映射原 V2 的 <code>/config</code> 目录并复用原数据库即可；切换前请先完整备份。这里的兼容是指 <strong>V2 数据库可由 V3 向前升级</strong>：V3 首次启动并完成数据库升级后，不能直接换回 V2 镜像，必须先按下文执行数据库降级。详见 <a href="/v3" class="is-internal-link is-valid-page">V3 版本说明</a> 和插件仓库的 <a href="https://github.com/jxxghp/MoviePilot-Plugins/blob/main/docs/V3_Plugin_Adaptation.md" class="is-external-link">V2 插件迁移到 V3</a>。</p>
<p class="is-danger">V2 容器的内建重启升级不会直接跨主版本升级到 V3。需要先将镜像改为 V3 镜像，重新拉取最新镜像并重建容器。V3 启动后会使用 <code>resources.v3</code> 和 <code>user.sites.v3.bin</code> 站点资源。</p>
<h3 id="v3-docker-镜像" class="toc-header"><a class="toc-anchor" href="#v3-docker-镜像">¶</a> V3 Docker 镜像</h3>
<p>V3 使用独立镜像仓库。使用 Docker Compose 时，先将 Compose 文件中 <code>moviepilot</code> 服务的 <code>image</code> 改为 <code>jxxghp/moviepilot-v3:latest</code>，再执行：</p>
<p>建议同时为 MoviePilot 服务设置 <code>stop_grace_period: 120s</code>，让镜像重建前的容器停止过程有足够时间完成后台任务和模块收尾。使用 <code>docker run</code> 或 <code>docker create</code> 部署时设置 <code>--stop-timeout 120</code>。</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash">docker compose pull moviepilot
docker compose up --force-recreate -d moviepilot
</code></pre>
<p>使用其他 Docker 管理器时，请手动拉取 <code>jxxghp/moviepilot-v3:latest</code> 并用该镜像重建原容器。需要固定版本时，将 <code>latest</code> 替换为对应的版本标签，例如 <code>3.0.0</code>。全新安装可使用 <code>moviepilot-v3</code> 容器名及 <code>/moviepilot-v3/config</code>、<code>/moviepilot-v3/core</code> 数据目录；从 V2 切换时应保留原有数据映射。</p>
<p>V3 的 Web 内建重启由镜像内 supervisor 托管 Nginx 和后端进程完成，不需要映射 Docker Socket，也不依赖 Docker<br>
restart policy；Docker restart policy 只负责容器级别的异常恢复和主机重启后拉起。</p>
<h3 id="从-v3-降级回-v2" class="toc-header"><a class="toc-anchor" href="#从-v3-降级回-v2">¶</a> 从 V3 降级回 V2</h3>
<p>V3 会把通用媒体身份统一保存为 <code>media_source</code> 和 <code>media_id</code>，并在数据库升级时删除 V2 仍会读取的来源专用字段：</p>
<div class="table-container"><table>
<thead>
<tr>
<th>数据表</th>
<th>V2 需要恢复的字段</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>subscribe</code>、<code>subscribehistory</code></td>
<td><code>tmdbid</code>、<code>imdbid</code>、<code>tvdbid</code>、<code>doubanid</code>、<code>bangumiid</code>、<code>anilistid</code>、<code>mediaid</code></td>
</tr>
<tr>
<td><code>downloadhistory</code>、<code>transferhistory</code></td>
<td><code>tmdbid</code>、<code>imdbid</code>、<code>tvdbid</code>、<code>doubanid</code>、<code>bangumiid</code>、<code>anilistid</code></td>
</tr>
<tr>
<td><code>downloadfailure</code></td>
<td><code>tmdbid</code>、<code>doubanid</code>、<code>bangumiid</code>、<code>anilistid</code></td>
</tr>
<tr>
<td><code>mediaserveritem</code></td>
<td><code>tmdbid</code>、<code>imdbid</code>、<code>tvdbid</code></td>
</tr>
</tbody>
</table></div>
<p>因此不能只把 Compose 中的镜像改回 <code>jxxghp/moviepilot-v2:latest</code>。正确顺序是：停止 V3 写入、备份、仍使用 V3 镜像执行数据库降级，最后再切换 V2 镜像。</p>
<blockquote class="is-danger">
<p>数据库降级会删除 V3 专用的音乐和 Agent 等字段或数据表。V3 升级时已经被合并丢弃的辅助来源 ID、被去重删除的整理历史，以及被 V3 覆盖的旧通知模板，无法仅从升级后的数据库完整还原。需要无损回退时，只能恢复升级 V3 前的完整备份。</p>
</blockquote>
<h4 id="h-1-停止-moviepilot-并备份" class="toc-header"><a class="toc-anchor" href="#h-1-停止-moviepilot-并备份">¶</a> 1. 停止 MoviePilot 并备份</h4>
<p>只停止 MoviePilot 服务，使用 PostgreSQL 时不要停止数据库服务：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash">docker compose stop moviepilot
</code></pre>
<p>SQLite 用户应复制宿主机实际映射的配置目录，至少备份其中的 <code>user.db</code>；PostgreSQL 用户应使用 <code>pg_dump</code> 备份数据库。同时备份 <code>/config</code> 目录中的配置文件。以下路径、服务名、数据库名和用户名应按实际部署修改：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash"># SQLite
cp -a /实际配置目录/user.db /实际备份目录/user.db.v3-before-downgrade

# PostgreSQL
docker compose exec -T postgresql \
  pg_dump -U moviepilot -d moviepilot -Fc \
  &gt; moviepilot-v3-before-downgrade.dump
</code></pre>
<p>确认备份文件能够读取后再继续。</p>
<h4 id="h-2-使用-v3-镜像执行数据库降级" class="toc-header"><a class="toc-anchor" href="#h-2-使用-v3-镜像执行数据库降级">¶</a> 2. 使用 V3 镜像执行数据库降级</h4>
<p>保持 Compose 文件中的 <code>moviepilot</code> 服务仍指向当前使用的 V3 镜像，在 Compose 文件所在目录执行：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash">docker compose run --rm --no-deps \
  --entrypoint /opt/venv/bin/python \
  moviepilot -c '
from configparser import ConfigParser

from alembic.command import downgrade
from alembic.config import Config

from app.runtime.config import settings

config = Config()
config.file_config = ConfigParser(interpolation=None)
config.set_main_option("script_location", str(settings.ROOT_PATH / "database"))
if settings.DB_TYPE.lower() == "postgresql":
    database_url = settings.DB_POSTGRESQL_URL()
else:
    database_path = settings.CONFIG_PATH / "user.db"
    database_url = f"sqlite:///{database_path}"
config.set_main_option("sqlalchemy.url", database_url)
downgrade(config, "a8c4e2f6b1d9")
'
</code></pre>
<p><code>a8c4e2f6b1d9</code> 是 V2 与 V3 数据库迁移链最后一个共用 revision。该命令会通过 V3 自带的降级迁移补回上述 V2 字段，并根据 <code>media_source + media_id</code> 将当前主来源 ID 回填到对应旧字段；其他已经在 V3 升级时丢弃的辅助 ID 会保持为空。</p>
<p>如果已经先换成 V2 镜像并出现 <code>no such column</code>、<code>UndefinedColumn</code> 或无法识别 V3 revision 的错误，请先停止服务，把镜像临时改回升级前所用的 V3 版本，执行本步骤成功后再继续。不要直接修改 <code>alembic_version</code>，只改版本号不会恢复被删除的字段和约束。</p>
<p>本地 CLI 安装方式应先停止 MoviePilot，在 V3 后端项目根目录使用项目虚拟环境执行同一段 Python 代码；将上面命令中的容器入口替换为 <code>.venv/bin/python</code>，并确保 <code>CONFIG_DIR</code> 指向实际配置目录。</p>
<h4 id="h-3-切换到-v2-镜像" class="toc-header"><a class="toc-anchor" href="#h-3-切换到-v2-镜像">¶</a> 3. 切换到 V2 镜像</h4>
<p>数据库降级命令成功结束后，将 Compose 文件中的镜像改为：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-yaml">image: jxxghp/moviepilot-v2:latest
</code></pre>
<p>然后拉取并重建 MoviePilot 服务：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash">docker compose pull moviepilot
docker compose up --force-recreate -d moviepilot
docker compose logs -f moviepilot
</code></pre>
<p>确认日志中没有数据库字段或 Alembic revision 错误，并检查订阅、下载历史、整理历史和媒体服务器数据后，再删除 V3 容器或旧备份。</p>
<h1 id="升级方法" class="toc-header"><a class="toc-anchor" href="#升级方法">¶</a> 升级方法</h1>
<p>按你使用的部署平台查看升级方法。</p>
<tabset><template v-slot:tabs=""><li>Docker <i class="mdi mdi-docker"></i></li><li>本地 CLI <i class="mdi mdi-console"></i></li><li>Synology套件 <i class="mdi mdi-linux"></i></li><li>Windows <i class="mdi mdi-microsoft-windows"></i></li></template><template v-slot:content=""><div class="tabset-panel"><h4 id="重启自动升级" class="toc-header"><a class="toc-anchor" href="#重启自动升级">¶</a> 重启自动升级</h4><blockquote class="is-warning">
<p><strong>注意：</strong> V1版本重启不会自动升级到V2版本。V1版本升级到V2版本需要重新配置，无法复用旧版本的配置文件、数据库文件等。</p>
</blockquote><p>根据 <a href="/configuration" class="is-internal-link is-valid-page">配置参考</a> 设置环境变量<code>MOVIEPILOT_AUTO_UPDATE</code>为<code>true</code>或<code>release</code>，<code>AUTO_UPDATE_RESOURCE</code>为<code>true</code>，开启重启自动升级以及资源包自动更新。此时只需要重启docker容器，或者在WEB管理界面中选择重启菜单（参考 <a href="docker.sock" class="is-asset-link">安装指引</a> 映射了<code>docker.sock</code>的前提下），即可自动重启升级到已发布的最新版本。</p><p><code>MOVIEPILOT_AUTO_UPDATE</code> 配置说明：</p><ul>
<li><code>true</code>/<code>release</code>：自动升级到已发布的最新版本。</li>
<li><code>false</code>：不开启重启自动升级。</li>
<li><code>dev</code>：自动升级到未发布的最新代码（仅限开发人员使用）。</li>
</ul><p><code>AUTO_UPDATE_RESOURCE</code>配置说明：当该值为<code>true</code>时，会自动检测 <a href="https://github.com/jxxghp/MoviePilot-Resources" class="is-external-link">资源包项目</a> 是否有更新，如有则会自动下载升级相应的资源文件，独立于<code>MOVIEPILOT_AUTO_UPDATE</code>生效，应用于不想升级主程序版本，但想让站点索引及站点认证数据保持最新的场景。当后续主程序功能建设稳定后，更新频度会大幅降低，此时可能只更新资源包但不更新主程序，<strong>建议打开此开关</strong>。</p><h4 id="手动升级" class="toc-header"><a class="toc-anchor" href="#手动升级">¶</a> 手动升级</h4><ul>
<li>使用docker-compose时，使用以下命令更新到最新境像:</li>
</ul><pre class="prismjs line-numbers" v-pre="true"><code class="language-bash">docker-compose pull jxxghp/moviepilot-v2:latest
docker-compose up --force-recreate -d
</code></pre><ul>
<li>手动更新镜像到最新版本，<strong>更新完成后需要重置容器才能应用最新镜像</strong>。</li>
</ul><pre class="prismjs line-numbers" v-pre="true"><code class="language-bash">docker pull jxxghp/moviepilot-v2:latest
</code></pre><p>不同的docker管理器重置容器的操作方式不同，<code>群晖docker</code>可直接在右键菜单中找到<code>重置</code>选项；<code>portainer</code>为在容器详情中点击<code>重建</code>；在正常映射了<code>/config</code>目录的前提下，重置/重建容器不会导致配置丢失。</p></div><div class="tabset-panel"><p>本地 CLI 安装模式不依赖 Docker 自动升级机制，请直接使用 <code>moviepilot update ...</code> 命令更新。</p><p>推荐流程：</p><pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot stop
moviepilot update all
moviepilot start
</code></pre><p>也可以分开更新：</p><pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot update backend
moviepilot update frontend
moviepilot update all --skip-resources
</code></pre><p>指定版本示例：</p><pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot update backend --ref v2.9.31
moviepilot update frontend --frontend-version v2.9.31
</code></pre><p>说明：</p><ul>
<li><code>update backend</code> 会更新本地 Git 仓库并重新安装后端依赖</li>
<li><code>update frontend</code> 会下载并替换前端 release</li>
<li><code>update all</code> 会同时更新后端、前端，并默认同步资源文件</li>
<li>如果当前仓库存在已跟踪源码改动，更新命令会停止，避免覆盖本地修改</li>
<li>通过 <code>moviepilot start</code> 管理起来的本地实例，现已支持系统内置重启；但程序升级仍建议显式执行 <code>moviepilot update ...</code></li>
</ul></div><div class="tabset-panel"><p>在软件源中安装新版本即可。</p></div><div class="tabset-panel"><ul>
<li>
<p>使用可执行文件版本的，删除旧版本<code>exe可执行文件</code>以及<code>nginx</code>目录（<code>config</code>目录不能删除），访问 <a href="https://github.com/jxxghp/MoviePilot/releases" class="is-external-link">此处</a> 下载最新版本可执行文件到原运行目录，双击运行即可。</p>
</li>
<li>
<p>使用 <a href="https://github.com/developer-wlj/Windows-MoviePilot" class="is-external-link">Windows-MoviePilot</a> 安装版本的，参考项目说明升级。</p>
</li>
</ul></div></template></tabset>
