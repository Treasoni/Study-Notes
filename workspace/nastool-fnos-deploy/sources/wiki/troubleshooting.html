<p>下载目录和媒体库目录出现跨盘/跨存储空间/单独映射路径的情况，导致无法实施硬链接，参考 <a href="/install" class="is-internal-link is-valid-page">安装指引</a> 中关于映射目录的说明。</p>
<p>同时<code>v1.9.4</code>以前版本为了兼容极空间处理，会出现跨盘硬链接时自动变成复制的情况，<code>v1.9.4</code>版本更正了该问题，详情参考 <a href="/release" class="is-internal-link is-valid-page">发行说明</a> 。</p>
<h1 id="重启后日志输出-no-module-named-apphelpersites" class="toc-header"><a class="toc-anchor" href="#重启后日志输出-no-module-named-apphelpersites">¶</a> 重启后日志输出 No module named 'app.helper.sites'</h1>
<p>该问题一般常见于容器启动时自动更新到一半，人为手动重启，更新进程被打断导致容器内依赖未安装完全。</p>
<p><strong>解决方法：</strong></p>
<ul>
<li>重置容器或者是重新创建一个新容器。</li>
<li>配置代理变量<code>PROXY_HOST</code>或者全局接入代理网络，加速自动更新的下载速度，避免超时引起的更新失败。</li>
</ul>
<h1 id="目录监控不自动整理文件" class="toc-header"><a class="toc-anchor" href="#目录监控不自动整理文件">¶</a> 目录监控不自动整理文件</h1>
<ol>
<li>启动日志报与<code>inotify</code>相关的错误时，在宿主机上（不是docker容器里）执行以下命令，并重启宿主机：</li>
</ol>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">echo fs.inotify.max_user_watches=5242880 | sudo tee -a /etc/sysctl.conf
echo fs.inotify.max_user_instances=5242880 | sudo tee -a /etc/sysctl.conf
sudo sysctl -p
</code></pre>
<p>2、挂载<code>网盘</code>、<code>Windows向Linux的SMB共享</code>、<code>NFS共享</code>等不支持事件触发的目录实时监控，打开目录监控的<code>兼容模式</code>可解决问题，但兼容模式下性能较低，可能会频繁读取磁盘。<br>
3、<code>设定 -&gt; 连接 -&gt; 下载器</code> 中开启<code>下载文件自动整理</code>，通过监控下载器完成文件自动整理，不使用目录监控。</p>
<h1 id="搜索报错siteshelper-object-has-no-attribute-async_get_indexers" class="toc-header"><a class="toc-anchor" href="#搜索报错siteshelper-object-has-no-attribute-async_get_indexers">¶</a> 搜索报错：SitesHelper' object has no attribute 'async_get_indexers'</h1>
<p>v2.6.8+出现无法搜索、无法添加站点问题的，检查认证资源版本是否为2.4.1+，站点资源版本是否为2.0.7+，如果不是且重启不会自动更新，请更新docker镜像。</p>
<h1 id="启动时重复下载浏览器内核" class="toc-header"><a class="toc-anchor" href="#启动时重复下载浏览器内核">¶</a> 启动时重复下载浏览器内核</h1>
<p>检查是不是有映射浏览器内核目录：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">/moviepilot-v2/core:/moviepilot/.cloakbrowser
</code></pre>
<h1 id="页面无法正常滚动" class="toc-header"><a class="toc-anchor" href="#页面无法正常滚动">¶</a> 页面无法正常滚动</h1>
<p>登录后点击用户名像-》弹出菜单中选择附加样式，把自定义CSS删除，刷新浏览器。</p>
<h1 id="页面显示不正常滚动异常选项不显示等ui问题" class="toc-header"><a class="toc-anchor" href="#页面显示不正常滚动异常选项不显示等ui问题">¶</a> 页面显示不正常，滚动异常，选项不显示等UI问题</h1>
<p>右上角头像菜单 -&gt; 关于MoviePilot -&gt; 浏览器缓存版本 -&gt; 清理缓存</p>
<blockquote class="is-success">
<p>更多问题解决方法，请访问Telegram 的 <a href="https://t.me/Moviepilot_Wiki" class="is-external-link">MoviePilot Wiki频道</a> 或 <a href="https://t.me/moviepilot_official" class="is-external-link">MoviePilot交流群</a>获取。问前请附带日志截图、配置截图等关键信息，便于快速解决您的问题；尽量不要试图仅通过文字描述进行提问，以获取问题答案。</p>
</blockquote>
