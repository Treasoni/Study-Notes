<p><code>moviepilot doctor</code> 是 MoviePilot 的离线诊断与自救入口，适合 WebUI、后端 API、Agent 或插件都不可用时使用。</p>
<p>它不会调用 MoviePilot 后端 API，而是直接检查本地配置、运行时文件、进程、端口、日志、依赖、数据库、前端资源和 Docker 环境。提交 Issue 前，也可以先用 doctor 收集诊断信息，减少来回补充日志的成本。</p>
<blockquote class="is-info">
<p>如果页面打不开、后端无法启动、插件导致启动异常，优先执行 <code>moviepilot doctor</code> 查看诊断结果；需要提交 Issue 时建议附带 doctor 摘要。</p>
</blockquote>
<h1 id="快速使用" class="toc-header"><a class="toc-anchor" href="#快速使用">¶</a> 快速使用</h1>
<h2 id="本地-cli" class="toc-header"><a class="toc-anchor" href="#本地-cli">¶</a> 本地 CLI</h2>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot doctor
moviepilot doctor --json
moviepilot doctor --fix
</code></pre>
<p>安全模式启动：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot start --safe
</code></pre>
<h2 id="docker" class="toc-header"><a class="toc-anchor" href="#docker">¶</a> Docker</h2>
<p>如果容器仍在运行，或已经进入诊断保活状态：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">docker exec -it &lt;container&gt; moviepilot doctor
docker exec -it &lt;container&gt; moviepilot doctor --json
docker exec -it &lt;container&gt; moviepilot doctor --fix
</code></pre>
<p>使用 Docker Compose 时，也可以进入对应服务执行：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">docker compose exec &lt;service&gt; moviepilot doctor
</code></pre>
<p>其中 <code>&lt;container&gt;</code> 是容器名或容器 ID，<code>&lt;service&gt;</code> 是 compose 文件中的服务名。</p>
<p>如果容器已经完全退出，可以用同一个镜像临时挂载配置目录运行 doctor：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">docker run --rm --entrypoint python -v &lt;config-dir&gt;:/config &lt;image&gt; -m app.cli doctor
</code></pre>
<p>其中 <code>&lt;config-dir&gt;</code> 是宿主机上的 MoviePilot 配置目录，<code>&lt;image&gt;</code> 是当前使用的 MoviePilot 镜像。</p>
<h1 id="常用参数" class="toc-header"><a class="toc-anchor" href="#常用参数">¶</a> 常用参数</h1>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot doctor --json
moviepilot doctor --fix
moviepilot doctor --deep
</code></pre>
<ul>
<li><code>--json</code>：输出结构化诊断结果，适合保存、上报或交给 Issue 反馈流程使用</li>
<li><code>--fix</code>：在白名单范围内执行安全修复</li>
<li><code>--deep</code>：执行更深入的检查，可能会比默认诊断慢一些</li>
</ul>
<h1 id="诊断内容" class="toc-header"><a class="toc-anchor" href="#诊断内容">¶</a> 诊断内容</h1>
<p>Doctor 默认执行只读检查，主要包括：</p>
<ul>
<li>运行路径：程序目录、配置目录、日志目录、Python 解释器</li>
<li>关键配置：<code>API_TOKEN</code>、<code>PORT</code>、<code>NGINX_PORT</code>、代理格式、安全模式</li>
<li>进程与端口：后端、前端端口监听状态，runtime 文件是否过期</li>
<li>日志线索：后端日志、启动日志、前端日志和插件日志中的近期错误</li>
<li>核心依赖：FastAPI、Pydantic、SQLAlchemy、Uvicorn、CloakBrowser 等是否可导入</li>
<li>数据库：SQLite 只读打开和完整性检查；PostgreSQL 默认做配置检查</li>
<li>前端资源：<code>version.txt</code>、<code>service.js</code> 或核心静态文件是否存在</li>
<li>Docker：<code>/config</code>、虚拟环境和容器内 <code>moviepilot</code> 命令是否可用</li>
</ul>
<p><code>--deep</code> 会启用可能较慢或更依赖当前网络、数据库环境的检查，例如 PostgreSQL TCP 连通性。</p>
<h1 id="自救能力" class="toc-header"><a class="toc-anchor" href="#自救能力">¶</a> 自救能力</h1>
<p><code>moviepilot doctor --fix</code> 只做白名单安全修复，避免误伤用户数据。</p>
<p>当前主要修复范围：</p>
<ul>
<li>清理指向已退出进程的 runtime 文件</li>
<li>在未被系统环境变量锁定时，为缺失或过短的 <code>API_TOKEN</code> 生成合规值</li>
</ul>
<p>Doctor 不会自动删除数据库、修改 Docker Compose、回滚迁移、批量禁用插件或删除用户数据。遇到需要人工确认的风险操作时，它只会给出处理建议。</p>
<h1 id="安全模式" class="toc-header"><a class="toc-anchor" href="#安全模式">¶</a> 安全模式</h1>
<p><code>moviepilot start --safe</code> 或 <code>MOVIEPILOT_SAFE_MODE=true</code> 会在本次启动中跳过：</p>
<ul>
<li>第三方插件加载与插件同步</li>
<li>调度器和 Agent 定时任务</li>
<li>目录监控</li>
<li>命令注册</li>
<li>工作流后台服务</li>
</ul>
<p>安全模式不修改用户配置，适合插件、调度任务或 Agent 导致后端无法启动时先恢复后台入口。修复问题后，移除 <code>MOVIEPILOT_SAFE_MODE=true</code> 或使用普通 <code>moviepilot start</code> 重启即可恢复完整能力。</p>
<p>Docker 环境建议临时添加环境变量后重启容器：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-env">MOVIEPILOT_SAFE_MODE=true
</code></pre>
<h1 id="docker-诊断保活" class="toc-header"><a class="toc-anchor" href="#docker-诊断保活">¶</a> Docker 诊断保活</h1>
<p>Docker 镜像默认启用：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-env">MOVIEPILOT_DOCKER_KEEPALIVE_ON_FAILURE=true
</code></pre>
<p>当后端主进程非正常退出时，entrypoint 不会立刻退出容器，而是打印一次 doctor 报告并保持容器运行，方便继续执行：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">docker exec -it &lt;container&gt; moviepilot doctor
</code></pre>
<p>通过前端内建重启、系统内置重启入口或用户手动触发的正常重启，会被识别为用户意图，不会进入诊断保活，也不会影响原有的内建手动重启流程。</p>
<p>如果需要恢复旧行为，可设置：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-env">MOVIEPILOT_DOCKER_KEEPALIVE_ON_FAILURE=false
</code></pre>
<p>Dockerfile 同时提供 <code>HEALTHCHECK</code>，用于标记容器健康状态。是否自动重启仍由 Docker Compose、NAS 平台或 Docker restart policy 决定。</p>
<h1 id="issue-反馈" class="toc-header"><a class="toc-anchor" href="#issue-反馈">¶</a> Issue 反馈</h1>
<p>Issue 反馈相关 skill 已支持调用：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot doctor --json
</code></pre>
<p>诊断摘要会写入预览和最终 Issue 正文，完整 doctor JSON 会保存在运行时 diagnostics 文件中，默认不会直接贴入 Issue，避免公开本机路径和过长输出。</p>
<p>公开粘贴诊断结果前，仍建议检查是否包含本机路径、域名、用户名等不希望公开的信息。</p>
