<p><code>moviepilot</code> 是 MoviePilot V2 的本地安装与管理入口，适用于 <code>macOS</code> 和 <code>Linux</code> 源码部署场景。</p>
<p>它负责：</p>
<ul>
<li>自动安装本地运行环境</li>
<li>下载前端 release</li>
<li>下载并同步资源文件</li>
<li>初始化配置</li>
<li>卸载本地运行环境</li>
<li>启动、停止、重启前后端服务</li>
<li>更新后端、前端和资源</li>
<li>通过命令行完成配置、调试和 Agent 请求</li>
</ul>
<blockquote class="is-info">
<p>Windows 用户如需使用本地 CLI，建议优先在 <code>WSL</code> 中运行；原生 Windows 仍建议使用安装版或 Docker。</p>
</blockquote>
<h1 id="一键安装" class="toc-header"><a class="toc-anchor" href="#一键安装">¶</a> 一键安装</h1>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">curl -fsSL https://raw.githubusercontent.com/jxxghp/MoviePilot/v2/scripts/bootstrap-local.sh | bash
</code></pre>
<p>脚本会自动：</p>
<ul>
<li>检测操作系统</li>
<li>自动检查并尽量安装 <code>git</code>、<code>curl</code>、<code>Python 3.12+</code></li>
<li>克隆 <code>MoviePilot</code></li>
<li>安装后端依赖</li>
<li>下载 <code>MoviePilot-Frontend</code> 最新 release</li>
<li>下载 <code>MoviePilot-Resources</code> 资源文件</li>
<li>将 <code>resources.v2/*</code> 同步到后端 <code>app/helper</code></li>
<li>自动下载本地 <code>Node</code> 运行时并安装前端运行依赖</li>
<li>执行初始化向导</li>
<li>创建全局 <code>moviepilot</code> 命令</li>
<li>默认启动前后端服务</li>
</ul>
<p>如果安装完成后当前终端仍提示找不到 <code>moviepilot</code>：</p>
<ul>
<li>重新打开终端</li>
<li>如果脚本提示使用了 <code>~/.local/bin</code>，执行 <code>source ~/.zshrc</code> 或 <code>source ~/.bashrc</code></li>
</ul>
<h1 id="配置目录" class="toc-header"><a class="toc-anchor" href="#配置目录">¶</a> 配置目录</h1>
<p>本地 CLI 默认将配置目录放在程序目录外，避免删除程序目录时把配置一并删掉。</p>
<ul>
<li>macOS：<code>~/Library/Application Support/MoviePilot</code></li>
<li>Linux：<code>${XDG_CONFIG_HOME:-~/.config}/moviepilot</code></li>
</ul>
<p>也可以在安装时手动指定：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot setup --config-dir /path/to/moviepilot-config
</code></pre>
<p>如果当前还没有可用配置目录，执行 <code>moviepilot setup</code> 或 <code>moviepilot init</code> 时会先展示默认路径并允许你确认或指定其它路径。</p>
<p>查看当前实际配置目录：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot config path
</code></pre>
<h1 id="初始化向导" class="toc-header"><a class="toc-anchor" href="#初始化向导">¶</a> 初始化向导</h1>
<p><code>moviepilot setup --wizard</code> 或 <code>moviepilot init --wizard</code> 会进入本地初始化向导。</p>
<p>向导当前支持配置：</p>
<ul>
<li><code>API_TOKEN</code></li>
<li>数据库类型
<ul>
<li>默认 <code>SQLite</code></li>
<li>可切换为 <code>PostgreSQL</code>，并填写主机、端口、数据库名、用户名、密码</li>
</ul>
</li>
<li>默认下载目录与媒体库目录</li>
<li>下载器</li>
<li>媒体服务器</li>
<li>消息通知渠道</li>
<li>用户站点认证
<ul>
<li>可直接选择支持的认证站点</li>
<li>按站点要求填写 <code>用户名</code>、<code>UID</code>、<code>Passkey</code> 等参数</li>
</ul>
</li>
<li>AI Agent
<ul>
<li>可按需启用 <code>AI_AGENT_ENABLE</code></li>
<li>配置 <code>LLM_PROVIDER</code>、<code>LLM_MODEL</code>、<code>LLM_API_KEY</code>、<code>LLM_BASE_URL</code></li>
<li>配置 <code>LLM_THINKING_LEVEL</code>、<code>LLM_SUPPORT_IMAGE_INPUT</code></li>
<li>配置 <code>LLM_SUPPORT_AUDIO_INPUT</code>、<code>AUDIO_INPUT_*</code></li>
<li>配置 <code>LLM_SUPPORT_AUDIO_OUTPUT</code>、<code>AUDIO_OUTPUT_*</code></li>
<li>配置 <code>AI_RECOMMEND_ENABLED</code></li>
</ul>
</li>
</ul>
<blockquote class="is-info">
<p>安装向导默认使用 <code>themoviedb</code> 作为识别来源，不再在首次安装流程中要求选择识别源。</p>
</blockquote>
<h1 id="常用命令" class="toc-header"><a class="toc-anchor" href="#常用命令">¶</a> 常用命令</h1>
<h2 id="安装与初始化" class="toc-header"><a class="toc-anchor" href="#安装与初始化">¶</a> 安装与初始化</h2>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot install deps
moviepilot install frontend
moviepilot install resources
moviepilot init --wizard
moviepilot setup --wizard
moviepilot uninstall
</code></pre>
<p>说明：</p>
<ul>
<li><code>install deps</code>：创建虚拟环境并安装后端依赖</li>
<li><code>install frontend</code>：下载前端 release，并自动安装本地 <code>Node</code> 运行时</li>
<li><code>install resources</code>：下载 <code>MoviePilot-Resources</code> 并同步到 <code>app/helper</code></li>
<li><code>init</code>：初始化本地配置</li>
<li><code>setup</code>：串行执行依赖安装、前端安装、资源同步和初始化</li>
<li><code>uninstall</code>：卸载本地运行环境，默认保留配置目录</li>
</ul>
<h2 id="卸载" class="toc-header"><a class="toc-anchor" href="#卸载">¶</a> 卸载</h2>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot uninstall
moviepilot uninstall --config-dir /path/to/moviepilot-config
</code></pre>
<p>说明：</p>
<ul>
<li>卸载时会进行两次确认</li>
<li>默认不删除配置目录</li>
<li>过程中会询问是否删除配置目录</li>
<li>源码目录不会被删除</li>
</ul>
<h2 id="服务管理" class="toc-header"><a class="toc-anchor" href="#服务管理">¶</a> 服务管理</h2>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot start
moviepilot stop
moviepilot restart
moviepilot status
moviepilot logs
moviepilot logs --frontend
moviepilot logs --stdio
moviepilot version
</code></pre>
<p>说明：</p>
<ul>
<li><code>start/stop/restart/status</code> 统一管理本地前后端服务</li>
<li>通过系统内置重启入口触发重启时，如果当前实例是由 <code>moviepilot start</code> 管理起来的，本地安装模式也支持内建重启</li>
<li><code>logs --frontend</code> 查看前端启动日志</li>
<li><code>logs --stdio</code> 查看后端启动标准输出</li>
</ul>
<h2 id="更新" class="toc-header"><a class="toc-anchor" href="#更新">¶</a> 更新</h2>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot update backend
moviepilot update frontend
moviepilot update all
</code></pre>
<p>常见用法：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot stop
moviepilot update all
moviepilot start
</code></pre>
<p>也可以指定版本：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot update backend --ref v2.9.31
moviepilot update frontend --frontend-version v2.9.31
</code></pre>
<p>说明：</p>
<ul>
<li><code>update backend</code> 会更新 Git 仓库并重新安装后端依赖</li>
<li><code>update frontend</code> 会更新前端 release</li>
<li><code>update all</code> 会同时更新后端、前端，并默认同步资源文件</li>
<li>更新前建议先执行 <code>moviepilot stop</code></li>
</ul>
<h2 id="agent" class="toc-header"><a class="toc-anchor" href="#agent">¶</a> Agent</h2>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot agent 帮我分析最近一次搜索失败的原因
moviepilot agent --user-id admin 帮我检查当前下载器配置
moviepilot agent --session cli-debug-1 帮我看看为什么没有自动整理
</code></pre>
<p>说明：</p>
<ul>
<li><code>moviepilot agent</code> 会直接向本地 Agent 发送一次请求</li>
<li>使用前需要先配置 LLM 参数，并开启 <code>AI_AGENT_ENABLE</code></li>
<li>智能助手相关配置说明参考 <a href="/agent" class="is-internal-link is-valid-page">智能助手</a></li>
</ul>
<h2 id="配置-工具与调度" class="toc-header"><a class="toc-anchor" href="#配置-工具与调度">¶</a> 配置、工具与调度</h2>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot config path
moviepilot config list
moviepilot config get PORT
moviepilot config set PORT 3001
moviepilot config keys
moviepilot config describe API_TOKEN

moviepilot tool list
moviepilot tool show query_schedulers
moviepilot tool run query_schedulers

moviepilot scheduler list
moviepilot scheduler run subscribe_refresh
</code></pre>
<h1 id="帮助与发现" class="toc-header"><a class="toc-anchor" href="#帮助与发现">¶</a> 帮助与发现</h1>
<p>根帮助：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot --help
moviepilot help
moviepilot commands
</code></pre>
<p>分级帮助：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot help install
moviepilot help init
moviepilot help setup
moviepilot help update
moviepilot help agent
moviepilot help config
moviepilot help config set
moviepilot help tool
moviepilot help scheduler
</code></pre>
<h1 id="完整命令清单" class="toc-header"><a class="toc-anchor" href="#完整命令清单">¶</a> 完整命令清单</h1>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-text">moviepilot install deps
moviepilot install frontend
moviepilot install resources
moviepilot init
moviepilot setup
moviepilot uninstall
moviepilot update backend
moviepilot update frontend
moviepilot update all
moviepilot agent
moviepilot start
moviepilot stop
moviepilot restart
moviepilot status
moviepilot logs
moviepilot version
moviepilot config path
moviepilot config list
moviepilot config get
moviepilot config set
moviepilot config keys
moviepilot config describe
moviepilot tool list
moviepilot tool show
moviepilot tool run
moviepilot scheduler list
moviepilot scheduler run
moviepilot help
moviepilot commands
</code></pre>
<h1 id="相关说明" class="toc-header"><a class="toc-anchor" href="#相关说明">¶</a> 相关说明</h1>
<ul>
<li>本地 CLI 安装模式会自动下载前端 release，不需要单独 clone 前端仓库</li>
<li>资源文件会自动从 <code>MoviePilot-Resources</code> 下载，不需要手工复制到 <code>app/helper</code></li>
<li>本地 CLI 安装模式的更新，不依赖 Docker 自动升级机制；请使用 <code>moviepilot update ...</code></li>
<li>如果本地仓库存在已跟踪源码改动，更新命令会停止，避免覆盖本地修改；未跟踪文件不会再阻断更新</li>
<li>如果你要把 MoviePilot 的工具能力接入 OpenClaw、Claude Code 等第三方 Agent，而不是直接在本地 CLI 里执行，可参考 <a href="/mcp" class="is-internal-link is-valid-page">MCP</a></li>
</ul>
