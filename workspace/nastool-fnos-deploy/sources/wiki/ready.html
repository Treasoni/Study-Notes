<p>MoviePilot通过调用 <a class="is-external-link" href="https://api.themoviedb.org">TheMovieDb</a> 的Api来读取和匹配媒体元数据，通过访问 <a class="is-external-link" href="https://github.com">Github</a> 来执行程序升级、安装插件等。有顺畅连接上述网址的网络环境是能流畅使用本软件的前提。<strong>推荐使用前两种方式</strong>，网络质量更加稳定。</p>
<h3 class="toc-header" id="单独代理"><a href="#单独代理" class="toc-anchor">¶</a> 单独代理</h3>
<p>搭建代理服务，并将代理地址填入MoviePilot的环境变量中，软件会自动对需要使用代理的请求使用代理服务器。具体可参考 <a class="is-internal-link is-valid-page" href="/configuration">配置参考</a> 章节设置代理服务器变量。</p>
<h3 class="toc-header" id="全局代理"><a href="#全局代理" class="toc-anchor">¶</a> 全局代理</h3>
<p>将MoviePilot所在的网络接入代理，通过分流规则将软件的网络请求通过代理发出，同时剔除站点相关的网络请求。</p>
<h3 class="toc-header" id="防域名污染与中转加速"><a href="#防域名污染与中转加速" class="toc-anchor">¶</a> 防域名污染与中转加速</h3>
<ul>
<li>更换TheMovieDb的Api地址为<code>api.tmdb.org</code>、开启<code>DOH</code>、本地修改<code>hosts</code>文件协持<code>api.themoviedb.org</code>域名地址为可访问IP、使用<code>Cloudflare Workers</code>搭建代理中转等，综合使用以上方式调优TheMovieDb的网络访问，涉及调整系统设定的参考 <a class="is-internal-link is-valid-page" href="/configuration">配置参考</a> 章节。</li>
<li>使用Github中转加速服务器来加快Github文件下载请求，具体可参考 <a class="is-internal-link is-valid-page" href="/configuration">配置参考</a> 章节。</li>
</ul>
<h4 class="toc-header" id="cloudflare-workers-参考代码"><a href="#cloudflare-workers-参考代码" class="toc-anchor">¶</a> Cloudflare Workers 参考代码：</h4>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-javascript">
async function handleRequest(request) {
  // 从请求URL中获取 API查询参数
  const url = new URL(request.url)
  const searchParams = url.searchParams

  // 设置代理API请求的URL地址
  const apiUrl = `https://api.themoviedb.org/${url.pathname}?${searchParams.toString()}`

  // 设置API请求的headers
  const headers = new Headers(request.headers)
  headers.set('Host', 'api.themoviedb.org')
  
  // 创建API请求
  const response = await fetch(apiUrl, {
    method: request.method,
    headers: headers
  })

  // 返回API响应
  return response
}

addEventListener('fetch', event =&gt; {
  event.respondWith(handleRequest(event.request))
})
</code></pre>
<h1 class="toc-header" id="操作系统"><a href="#操作系统" class="toc-anchor">¶</a> 操作系统</h1>
<p>部分功能基于文件系统监控实现（如<code>目录监控</code>等），监控的文件较多时，往往会因为操作系统默认允许的文件句柄数太小导致报错，相关功能失效，需在<strong>宿主机</strong>操作系统上（不是docker容器内）执行以下命令并重启生效：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf
echo fs.inotify.max_user_instances=524288 | sudo tee -a /etc/sysctl.conf
sudo sysctl -p
</code></pre>
<h1 class="toc-header" id="站点"><a href="#站点" class="toc-anchor">¶</a> 站点</h1>
<p>MoviePilot包括两大部分功能：<code>文件整理刮削</code>、<code>资源订阅下载</code>，其中<code>资源订阅下载</code>功能需要有可用的<code>PT站点</code>，<strong>同时这些站点中需要有一个可用于认证</strong>，关于用户认证请参考 <a class="is-internal-link is-valid-page" href="/basic">基础</a> 章节的相关说明。</p>
<h1 class="toc-header" id="配套软件"><a href="#配套软件" class="toc-anchor">¶</a> 配套软件</h1>
<p>MoviePilot只是媒体库自动化管理的一环，需要通过调用<code>下载器</code>来完成资源的下载，需要通过<code>媒体服务器</code>来管理和展示媒体资源，<strong>同时通过媒体服务器Api来查询库存情况控制重复下载</strong>，通过<code>CookieCloud</code>来快速同步站点Cookie和新增站点。安装前需要先完成配套软件的安装。</p>
<h3 class="toc-header" id="下载器"><a href="#下载器" class="toc-anchor">¶</a> 下载器</h3>
<ul>
<li><strong>Qbittorrent</strong>：版本要求 &gt;= <code>4.3.9</code></li>
<li><strong>Transmission</strong>：版本要求 &gt;= <code>3.0</code></li>
</ul>
<h3 class="toc-header" id="媒体服务器"><a href="#媒体服务器" class="toc-anchor">¶</a> 媒体服务器</h3>
<ul>
<li><strong>Emby</strong>：建议版本 &gt;= <code>4.8.0.45</code></li>
<li><strong>Jellyfin</strong>：推荐使用<code>latest</code>分支</li>
<li><strong>Plex</strong>：无特定版本要求</li>
</ul>
<h3 class="toc-header" id="cookiecloud"><a href="#cookiecloud" class="toc-anchor">¶</a> CookieCloud</h3>
<ul>
<li><strong>CookieCloud服务端</strong>：可选，MoviePilot已经内置了CookieCloud服务端，如需独立安装可参考 <a class="is-external-link" href="https://github.com/easychen/CookieCloud">easychen/CookieCloud</a> 说明</li>
<li><strong>CookieCloud浏览器插件</strong>：不管是使用CookieCloud独立服务端还是使用内置服务，都需要安装浏览器插件，访问 <a class="is-external-link" href="https://github.com/easychen/CookieCloud/releases">此处</a> 下载安装到浏览器。</li>
</ul>
<h3 class="toc-header" id="docker管理器"><a href="#docker管理器" class="toc-anchor">¶</a> Docker管理器</h3>
<p>如果你计划使用docker来部署MoviePilot，请确认你的环境是否可以方便地编辑容器配置，否则建议安装 <a class="is-external-link" href="https://github.com/portainer/portainer">portainer</a> 来简化容器操作。</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">docker run -d --restart=always --name="portainer" -p 9000:9000 -v /var/run/docker.sock:/var/run/docker.sock 6053537/portainer-ce

</code></pre>
<h3 class="toc-header" id="overseerrjellyseerr"><a href="#overseerrjellyseerr" class="toc-anchor">¶</a> Overseerr/Jellyseerr</h3>
<p>如果你希望将MoviePilot的自动化媒体管理能力开放给多个人使用，同时具有用户提交订阅申请与集中审批的功能，可以安装 <code>Overseerr</code>/<code>Jellyseerr</code>来配合实现更好的选片和申请审批使用体验。MoviePilot通过模拟<code>Radarr</code>和<code>Sonarr</code>的Api实现无缝集成，<code>Overseerr</code>/<code>Jellyseerr</code>负责选片和用户权限管理，MoviePilot负责订阅、下载和整理。参考下图：</p>
