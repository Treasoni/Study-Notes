<p>MoviePilot V2 已内置智能助手能力，可用于：</p>
<ul>
<li>通过 <code>WEB</code> 设置页或初始化向导完成 AI 配置</li>
<li>通过 <code>moviepilot agent ...</code> 在本地 CLI 中直接发起一次智能体请求</li>
<li>在已接入对应能力的消息渠道中，以文本、图片、文件、语音等方式与智能助手交互</li>
<li>在资源搜索结果页执行 <code>AI智能推荐</code></li>
<li>在整理历史记录中对单条失败或可疑记录执行 <code>智能助手整理</code></li>
</ul>
<blockquote class="is-info">
<p>智能助手不是独立部署的第三个服务，而是 MoviePilot 主程序的一部分。启用后即可在现有页面、CLI 与消息渠道中使用。</p>
</blockquote>
<h1 id="智能助手到底能做什么" class="toc-header"><a class="toc-anchor" href="#智能助手到底能做什么">¶</a> 智能助手到底能做什么</h1>
<p>智能助手的核心不是“陪聊”，而是“读取当前上下文 + 调用 MoviePilot 工具 + 按技能流程执行”。</p>
<p>也就是说，它不只是回答一句建议，而是可以在权限允许的范围内，真的去查询、判断、筛选、触发操作，甚至把结果再发回给你。</p>
<p>当前代码里的能力来源主要有三层：</p>
<ul>
<li><strong>内置工具：</strong> MoviePilot 启动时会为智能助手加载一组内置工具，覆盖媒体、订阅、下载、整理、站点、目录、工作流、插件等系统能力</li>
<li><strong>技能系统：</strong> 对复杂流程，智能助手可以读取内置或自定义 <code>SKILL.md</code>，按预设步骤组合工具执行，而不是每次都从零乱试</li>
<li><strong>插件扩展：</strong> 已安装插件不仅可以提供 <code>/命令</code>，也可以直接向智能助手注册新的 Agent 工具</li>
</ul>
<h2 id="h-1-媒体检索-识别与推荐" class="toc-header"><a class="toc-anchor" href="#h-1-媒体检索-识别与推荐">¶</a> 1. 媒体检索、识别与推荐</h2>
<p>智能助手可以：</p>
<ul>
<li>搜索电影、剧集、动漫，获取 TMDB 详情、季集信息、演职员信息</li>
<li>根据资源标题、文件路径、下载内容识别媒体信息</li>
<li>查询剧集播出计划，辅助判断“缺的是哪一季/哪几集”</li>
<li>获取热门推荐、趋势榜单，并参与 <code>AI智能推荐</code> 的二次筛选</li>
</ul>
<p>典型问题：</p>
<ul>
<li><code>帮我找一下《最后生还者》第二季</code></li>
<li><code>这个种子标题到底是哪部剧</code></li>
<li><code>这部剧现在更新到第几集了</code></li>
</ul>
<h2 id="h-2-搜索资源-筛选结果与发起下载" class="toc-header"><a class="toc-anchor" href="#h-2-搜索资源-筛选结果与发起下载">¶</a> 2. 搜索资源、筛选结果与发起下载</h2>
<p>智能助手不仅能“建议搜什么”，还可以直接走搜索下载链路：</p>
<ul>
<li>先搜索媒体，获取准确的 <code>TMDB / 豆瓣 ID</code></li>
<li>再调用站点搜索工具查资源</li>
<li>根据免费、分辨率、制作组、做种数等条件继续筛选结果</li>
<li>确认后直接添加下载任务</li>
<li>查询当前下载器配置、下载任务、进度、标签、下载历史</li>
<li>对下载任务执行查询、删除、修改等操作</li>
</ul>
<p>典型问题：</p>
<ul>
<li><code>帮我搜《沙丘2》的资源，优先 2160p 和免费</code></li>
<li><code>看看现在哪些下载卡住了</code></li>
<li><code>把这个下载任务删掉并清理文件</code></li>
</ul>
<h2 id="h-3-订阅管理与缺集处理" class="toc-header"><a class="toc-anchor" href="#h-3-订阅管理与缺集处理">¶</a> 3. 订阅管理与缺集处理</h2>
<p>智能助手可以直接参与订阅生命周期：</p>
<ul>
<li>新增、查询、更新、删除订阅</li>
<li>触发某个订阅立即补搜</li>
<li>查询热门订阅、订阅历史、订阅分享</li>
<li>在新增下载或订阅前，先检查媒体是否已经在库、是否已经订阅，避免重复</li>
</ul>
<p>典型问题：</p>
<ul>
<li><code>帮我订阅《人生切割术》第二季</code></li>
<li><code>看看这个订阅为什么还没补齐</code></li>
<li><code>这部片是不是已经订阅过了</code></li>
</ul>
<h2 id="h-4-整理-媒体库与文件系统" class="toc-header"><a class="toc-anchor" href="#h-4-整理-媒体库与文件系统">¶</a> 4. 整理、媒体库与文件系统</h2>
<p>这部分是智能助手最适合发挥的场景之一：</p>
<ul>
<li>查询整理历史、失败记录、失败原因、源路径和目标路径</li>
<li>直接调用整理工具，对文件或目录重新识别并整理</li>
<li>查询目录配置，或直接查看某个真实目录里的文件内容</li>
<li>查询媒体服务器中是否已存在某部作品，避免重复下载</li>
<li>查询 Plex / Emby / Jellyfin 最近入库内容</li>
</ul>
<p>如果已开启 <code>AI_AGENT_RETRY_TRANSFER=true</code>，系统还可以把整理失败记录自动交给内置技能 <code>transfer-failed-retry</code> 处理；同一批失败文件会合并分析，再批量重试。</p>
<p>典型问题：</p>
<ul>
<li><code>帮我分析最近一次整理失败的原因</code></li>
<li><code>这个目录下的文件帮我识别并整理</code></li>
<li><code>看看 Plex 里最近入库了什么</code></li>
<li><code>这部剧媒体库里已经有了吗</code></li>
</ul>
<h2 id="h-5-站点-下载器-调度与工作流排障" class="toc-header"><a class="toc-anchor" href="#h-5-站点-下载器-调度与工作流排障">¶</a> 5. 站点、下载器、调度与工作流排障</h2>
<p>智能助手并不只懂“媒体”，也能直接查询和排查运行状态：</p>
<ul>
<li>查询站点配置、站点用户数据、站点优先级</li>
<li>测试站点连通性</li>
<li>更新站点配置，或通过账号密码自动刷新站点 Cookie / UA</li>
<li>查询下载器配置</li>
<li>查询并手动触发定时服务</li>
<li>查询并手动执行工作流</li>
</ul>
<p>典型问题：</p>
<ul>
<li><code>测试一下这个站点能不能连通</code></li>
<li><code>帮我看看下载器配置有没有明显问题</code></li>
<li><code>列出当前所有定时任务，并跑一次签到</code></li>
<li><code>这个工作流失败在哪一步</code></li>
</ul>
<h2 id="h-6-插件联动-命令分发与高级运维" class="toc-header"><a class="toc-anchor" href="#h-6-插件联动-命令分发与高级运维">¶</a> 6. 插件联动、命令分发与高级运维</h2>
<p>如果系统装了插件，智能助手还能继续扩展能力：</p>
<ul>
<li>查询已安装插件</li>
<li>查询插件暴露给系统的命令、动作、定时服务</li>
<li>直接触发系统 <code>/命令</code> 与插件 <code>/命令</code></li>
<li>自动加载插件提供的 Agent 工具</li>
</ul>
<p>此外，当前内置工具里还包含一些更偏高级的能力：</p>
<ul>
<li>读取、编辑、写入本地文本文件</li>
<li>执行本地 Shell 命令</li>
<li>用 Playwright 浏览器自动化方式打开网页、点击按钮、抓取内容</li>
</ul>
<p>这些能力非常适合排障，但通常也意味着更高权限要求。</p>
<p>典型问题：</p>
<ul>
<li><code>列出当前已安装插件，以及每个插件有哪些命令</code></li>
<li><code>帮我执行 /sites 看看站点状态</code></li>
<li><code>打开这个网页帮我看看是不是登录失效</code></li>
</ul>
<h2 id="h-7-文本-图片-文件-语音与交互式回复" class="toc-header"><a class="toc-anchor" href="#h-7-文本-图片-文件-语音与交互式回复">¶</a> 7. 文本、图片、文件、语音与交互式回复</h2>
<p>智能助手支持的不只是纯文本：</p>
<ul>
<li>文本：正常对话、问答、分析、指令执行</li>
<li>图片：模型支持多模态时直接看图；不支持时会自动转为本地附件路径继续处理</li>
<li>文件：先保存到临时目录，再把 <code>local_path</code> 提供给智能助手处理</li>
<li>语音 / 音频：语音消息或音频附件会先转写成文本，再继续对话；在支持真实语音发送的渠道中，也可以回传语音答复</li>
<li>按钮：在支持按钮与回调的消息渠道里，智能助手可以主动发按钮让你点选，而不是反复追问</li>
</ul>
<p>因此你可以把它理解成：</p>
<ul>
<li>既能分析问题</li>
<li>也能动手查系统</li>
<li>还能在一定范围内直接替你执行 MoviePilot 里的实际操作</li>
</ul>
<h1 id="快速启用" class="toc-header"><a class="toc-anchor" href="#快速启用">¶</a> 快速启用</h1>
<h2 id="方式一安装向导" class="toc-header"><a class="toc-anchor" href="#方式一安装向导">¶</a> 方式一：安装向导</h2>
<p>初始化向导已内置第 7 步 <code>智能助手</code>，无论是 WEB 首次安装向导，还是本地 CLI 的 <code>moviepilot setup --wizard</code>，都可以直接完成常用 AI 参数配置。</p>
<h2 id="方式二系统设置" class="toc-header"><a class="toc-anchor" href="#方式二系统设置">¶</a> 方式二：系统设置</h2>
<p>也可以在 <code>设定 -&gt; 系统 -&gt; 基础设置</code> 中后续调整智能助手相关参数。修改后点击页面底部的 <code>保存</code> 生效。</p>

<p>后续在 <code>设定 -&gt; 系统 -&gt; 基础设置</code> 调整 LLM 参数时，可以点击 <code>测试调用</code> 验证 <code>LLM提供商</code>、<code>LLM基础URL</code>、<code>LLM API密钥</code> 和 <code>LLM模型名称</code> 是否可用。</p>
<blockquote class="is-info">
<p><code>支持音频输入</code> 与 <code>支持音频输出</code> 是两个独立开关。真正能否识别语音、是否能回传语音，仍取决于 <code>AUDIO_INPUT_*</code> / <code>AUDIO_OUTPUT_*</code> 配置是否可用，以及当前消息渠道本身是否支持。</p>
</blockquote>
<p>未在上表中的高级项，例如 <code>SKILL_MARKET</code>、<code>LLM_TEMPERATURE</code>、<code>LLM_MAX_ITERATIONS</code>、<code>LLM_TOOL_TIMEOUT</code>、<code>LLM_MEMORY_*</code>、<code>TAVILY_API_KEY</code>、<code>EXA_API_KEY</code> 等，通常仍通过配置文件、环境变量或部署平台变量维护。完整参数说明参考 <a href="/configuration" class="is-internal-link is-valid-page">配置参考</a> 中的 <code>智能助手</code> 章节。</p>
<h1 id="基础配置建议" class="toc-header"><a class="toc-anchor" href="#基础配置建议">¶</a> 基础配置建议</h1>
<p>最少需要准备以下几项：</p>
<ul>
<li>在 WEB 中打开 <code>启用智能助手</code>（<code>AI_AGENT_ENABLE</code>）</li>
<li>选择 <code>LLM提供商</code>（<code>LLM_PROVIDER</code>）</li>
<li>填写 <code>LLM API密钥</code>（<code>LLM_API_KEY</code>）</li>
<li>填写或刷新选择 <code>LLM模型名称</code>（<code>LLM_MODEL</code>）</li>
<li>如果希望处理语音消息，再打开 <code>支持音频输入</code>，并至少配置可用的 <code>音频输入 API密钥</code> 和 <code>音频输入模型</code></li>
</ul>
<p>常见建议：</p>
<ul>
<li>如果模型或平台支持多模态输入，建议保持 <code>LLM_SUPPORT_IMAGE_INPUT=true</code></li>
<li>如果只需要“用户发语音，系统先转写后继续对话”，重点确认 <code>LLM_SUPPORT_AUDIO_INPUT=true</code> 且 <code>AUDIO_INPUT_*</code> 可用</li>
<li>如果还希望智能助手回传语音，再继续打开 <code>LLM_SUPPORT_AUDIO_OUTPUT</code> 并配置 <code>AUDIO_OUTPUT_MODEL</code> 和 <code>AUDIO_OUTPUT_VOICE</code></li>
<li>音频输入/输出的 Key 与基础地址独立于 LLM；即使 LLM 与语音共用同一家 OpenAI 兼容服务，也请在 <code>AUDIO_INPUT_*</code> / <code>AUDIO_OUTPUT_*</code> 中填写对应 Key 与地址</li>
<li>如果使用 OpenAI 兼容接口，可按需填写 <code>LLM_BASE_URL</code></li>
<li>如果希望智能助手可以直接在多个入口中使用，可打开 <code>AI_AGENT_GLOBAL</code></li>
<li>如果希望系统后台定时检查智能体任务，可配置 <code>AI_AGENT_JOB_INTERVAL</code></li>
</ul>
<h1 id="工具系统-技能系统与权限边界" class="toc-header"><a class="toc-anchor" href="#工具系统-技能系统与权限边界">¶</a> 工具系统、技能系统与权限边界</h1>
<h2 id="工具系统" class="toc-header"><a class="toc-anchor" href="#工具系统">¶</a> 工具系统</h2>
<p>智能助手当前并不是写死几个固定动作，而是通过工具工厂动态装载工具集。</p>
<p>这意味着：</p>
<ul>
<li>不同版本的 MoviePilot，工具数量和能力范围可能继续扩展</li>
<li>已安装插件也可以向智能助手继续注入工具</li>
<li>你看到的“实际能力”，应以当前实例实际暴露出来的工具为准</li>
</ul>
<p>如果你想查看当前实例到底有哪些可用工具，可以用：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot tool list
moviepilot tool show query_download_tasks
moviepilot tool show transfer_file
moviepilot tool show run_slash_command
</code></pre>
<p>更多说明参考 <a href="/cli" class="is-internal-link is-valid-page">本地 CLI</a>。</p>
<h2 id="技能系统" class="toc-header"><a class="toc-anchor" href="#技能系统">¶</a> 技能系统</h2>
<p>对于复杂流程，智能助手不一定只靠单步工具调用，也会结合技能系统。</p>
<p>当前内置技能已覆盖的方向包括：</p>
<ul>
<li><code>transfer-failed-retry</code>：整理失败自动分析与批量重试</li>
<li><code>generate-identifiers</code>：生成或更新自定义识别词</li>
<li><code>command-dispatch</code>：为自然语言需求匹配并执行系统或插件命令</li>
<li><code>moviepilot-api</code>：直接调用 MoviePilot API</li>
<li><code>moviepilot-update</code>：升级、重启等维护流程</li>
</ul>
<p>如果你自己在 <code>CONFIG_DIR/agent/skills</code> 下新增技能目录并提供 <code>SKILL.md</code>，智能助手也可以把它当作新的流程模板来使用。</p>
<h3 id="skills-命令管理技能" class="toc-header"><a class="toc-anchor" href="#skills-命令管理技能">¶</a> <code>/skills</code> 命令：管理技能</h3>
<p><code>/skills</code> 是消息渠道中的远程命令，用来管理智能助手可用的技能。它和 <code>moviepilot agent</code> 不同，不是在本地 CLI 里执行，而是在 Telegram、微信等已接入 <code>/命令</code> 的消息渠道中发送。</p>
<p>它主要可以完成这些事：</p>
<ul>
<li>查看当前已安装技能，并区分 <code>内置</code>、<code>本地</code>、<code>仓库来源</code>、<code>社区注册表</code></li>
<li>浏览 <code>SKILL_MARKET</code> 中配置的公开技能源，默认包含 <code>ClawHub</code>、<code>openai/skills</code>、<code>anthropics/skills</code>、<code>vercel-labs/agent-skills</code></li>
<li>按技能 <code>ID</code>、名称、描述、来源标签搜索市场技能</li>
<li>将市场技能安装到 <code>CONFIG_DIR/agent/skills/&lt;skill-id&gt;/</code></li>
<li>删除非内置技能；MoviePilot 自带的内置技能只能查看，不能删除</li>
<li>刷新技能市场缓存，重新拉取最新公开技能列表</li>
</ul>
<p>常见用法：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-text">/skills
/skills refresh
/skills 刷新
/skills weather
/skills 搜索 weather
</code></pre>
<p>交互方式：</p>
<ul>
<li>如果当前消息渠道支持按钮和回调，发送 <code>/skills</code> 后会直接出现 <code>已安装技能</code>、<code>技能市场</code>、<code>搜索</code>、<code>安装</code>、<code>删除</code>、<code>刷新</code>、<code>关闭</code> 等按钮</li>
<li>如果当前渠道不支持按钮，也可以继续发送文本指令：<code>1</code>、<code>2</code>、<code>搜索 &lt;关键词&gt;</code>、<code>清除搜索</code>、<code>安装 &lt;序号&gt;</code>、<code>删除 &lt;序号&gt;</code>、<code>n</code>、<code>p</code>、<code>返回</code>、<code>刷新</code>、<code>退出</code></li>
</ul>
<p>需要注意：</p>
<ul>
<li><code>/skills</code> 的市场列表来自 <code>SKILL_MARKET</code> 配置；如果不配置市场源，命令仍可查看已安装技能，但不会有可安装的市场条目</li>
<li><code>ClawHub</code> 在界面中会按 <code>社区注册表</code> 展示，安装前应自行甄别技能质量与安全性</li>
<li>你手工放到 <code>CONFIG_DIR/agent/skills</code> 下的自定义技能，也会出现在 <code>/skills</code> 的已安装列表中</li>
</ul>
<h2 id="记忆与定时任务" class="toc-header"><a class="toc-anchor" href="#记忆与定时任务">¶</a> 记忆与定时任务</h2>
<p>除了即时对话，智能助手还带有两类辅助机制：</p>
<ul>
<li><strong>记忆：</strong> 会自动保留会话上下文，并可在 <code>CONFIG_DIR/agent</code> 下维护长期偏好记忆</li>
<li><strong>Jobs：</strong> 可以在 <code>CONFIG_DIR/agent/jobs</code> 中维护待办任务；当 <code>AI_AGENT_JOB_INTERVAL</code> 大于 <code>0</code> 时，系统会按间隔唤醒智能助手检查并执行待处理任务</li>
</ul>
<p>所以它不仅能回答“现在怎么做”，也能在一定程度上承担“之后继续做”的任务。</p>
<h2 id="权限边界" class="toc-header"><a class="toc-anchor" href="#权限边界">¶</a> 权限边界</h2>
<p>并不是所有入口、所有用户都能无限制调用所有工具。</p>
<p>需要特别注意：</p>
<ul>
<li>很多查询类能力可以直接使用</li>
<li>但修改配置、删除记录、执行 <code>/命令</code>、触发调度、运行工作流、执行本地命令、编辑文件等高风险操作，通常需要管理员权限</li>
<li>在消息渠道中，代码会根据“渠道管理员名单”或系统管理员身份判断是否允许执行这些工具</li>
<li>图片、文件、语音、按钮等能力，也取决于当前消息渠道本身是否支持</li>
</ul>
<p>因此，智能助手是“有工具的智能体”，但不是“无条件的超级管理员”。</p>
<p>外部管理员级集成需要单独理解：MCP 以及 OpenAI / Anthropic 兼容的 Agent API 使用 <code>API_TOKEN</code> 认证，持有该密钥的客户端会被视为受信任的管理员级 Agent 集成。它不同于普通登录用户在 WEB 页面里的 UI 权限，也不会因为某个普通用户会话而自动收窄能力范围。只应把 <code>API_TOKEN</code> 配置给你信任的客户端、网关或自动化系统。</p>
<h1 id="图片-文件与语音" class="toc-header"><a class="toc-anchor" href="#图片-文件与语音">¶</a> 图片、文件与语音</h1>
<h2 id="图片输入" class="toc-header"><a class="toc-anchor" href="#图片输入">¶</a> 图片输入</h2>
<p><code>LLM_SUPPORT_IMAGE_INPUT</code> 是当前图片能力的唯一开关：</p>
<ul>
<li>为 <code>true</code> 时，图片会按多模态输入发送给模型</li>
<li>为 <code>false</code> 时，图片不会被拒绝，而是自动转成附件文件，落盘后以本地文件路径提供给智能助手</li>
</ul>
<h2 id="文件输入" class="toc-header"><a class="toc-anchor" href="#文件输入">¶</a> 文件输入</h2>
<p>用户上传的文件会保留原始文件名与基础元数据，MoviePilot 会先将文件保存到临时目录，再把 <code>local_path</code> 提供给智能助手使用。</p>
<p>临时目录位置在：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-text">TEMP_PATH/agent_uploads/&lt;session_id&gt;/
</code></pre>
<p>这意味着：</p>
<ul>
<li>不需要额外把文件内容手工贴到聊天里</li>
<li>智能助手可以直接基于本地文件路径处理原文件</li>
<li>文件会按系统临时文件清理策略清除，保留天数由 <code>TEMP_FILE_DAYS</code> 控制</li>
</ul>
<h2 id="音频输入与语音回复" class="toc-header"><a class="toc-anchor" href="#音频输入与语音回复">¶</a> 音频输入与语音回复</h2>
<p>MoviePilot 当前的语音能力不是直接内嵌在 LLM 里，而是通过独立的音频能力管理器完成。音频输入使用 <code>LLM_SUPPORT_AUDIO_INPUT</code> + <code>AUDIO_INPUT_*</code>，语音回复使用 <code>LLM_SUPPORT_AUDIO_OUTPUT</code> + <code>AUDIO_OUTPUT_*</code>。</p>
<p>当前代码里的几个关键点：</p>
<ul>
<li>当前内置并已注册的音频 provider 有 <code>openai</code>、<code>openai_chat_audio</code> 和 <code>mimo</code></li>
<li><code>openai</code> 适用于 OpenAI 官方音频接口以及兼容 OpenAI 音频接口的服务</li>
<li><code>openai_chat_audio</code> 适用于通过 Chat Completions 音频能力完成转写或语音输出的兼容服务</li>
<li><code>mimo</code> 适用于 Xiaomi MiMo，默认基础地址为 <code>https://api.xiaomimimo.com/v1</code></li>
<li>音频输入与语音输出可以选择不同 provider，也可以使用不同 Key、基础地址和模型</li>
<li><code>AUDIO_INPUT_API_KEY</code> / <code>AUDIO_OUTPUT_API_KEY</code> 不会自动复用 <code>LLM_API_KEY</code>；如果与 LLM 使用同一家服务，也需要在音频字段中填写同一个 Key</li>
<li>当前单个转写音频大小上限为 <code>10MB</code>；只有音频但转写失败时，系统会直接提示 <code>语音识别失败，请稍后重试</code></li>
</ul>
<h3 id="当前已接入的消息渠道" class="toc-header"><a class="toc-anchor" href="#当前已接入的消息渠道">¶</a> 当前已接入的消息渠道</h3>
<ul>
<li><code>Telegram</code>：支持接收 <code>voice</code> / <code>audio</code>，也支持真实语音回传</li>
<li><code>企业微信应用模式</code>（<code>WECHAT_MODE=app</code>）：支持语音接收、语音转写和真实语音回传</li>
<li><code>Slack</code>、<code>Discord</code>、<code>QQ</code>、<code>VoceChat</code>、<code>SynologyChat</code>：支持把音频附件下载后做转写，当前默认回复仍以文字为主</li>
<li><code>企业微信机器人模式</code>（<code>WECHAT_MODE=bot</code>）：当前能识别到“收到的是语音消息”，但代码里不会自动下载并转写该语音；如果你需要完整语音交互，建议改用应用模式</li>
</ul>
<blockquote class="is-info">
<p><code>识别语言</code> 对应 <code>AUDIO_INPUT_LANGUAGE</code>，只用于语音转写阶段给模型一个语言提示，例如 <code>zh</code>、<code>en</code>。它不会限制智能助手最终用什么语言回答，也不是 WEB 界面语言设置。</p>
</blockquote>

<h1 id="使用入口" class="toc-header"><a class="toc-anchor" href="#使用入口">¶</a> 使用入口</h1>
<h2 id="web搜索页-ai-智能推荐" class="toc-header"><a class="toc-anchor" href="#web搜索页-ai-智能推荐">¶</a> WEB：搜索页 AI 智能推荐</h2>
<p>当 <code>AI_RECOMMEND_ENABLED</code> 打开后，资源搜索结果页可基于当前结果执行智能推荐。</p>
<p>当前行为特点：</p>
<ul>
<li>推荐是基于当前搜索结果进行二次排序/筛选，不会替代原始搜索</li>
<li>切换查看 <code>AI推荐结果</code> 与 <code>原始结果</code> 时，原有筛选条件会自动保存与恢复</li>
<li>正在搜索时，页面会优先展示流式进度与结果预览，避免整页空白等待</li>
</ul>
<h2 id="web历史记录中的智能助手整理" class="toc-header"><a class="toc-anchor" href="#web历史记录中的智能助手整理">¶</a> WEB：历史记录中的智能助手整理</h2>
<p>在 <code>历史记录 -&gt; 整理历史</code> 中，单条记录菜单已提供 <code>智能助手整理</code> 操作。</p>
<p>它适合处理：</p>
<ul>
<li>识别错误但很难手工修正的记录</li>
<li>失败原因复杂、需要上下文判断的整理记录</li>
<li>希望让智能助手结合系统工具重新分析并执行整理的场景</li>
</ul>
<p>执行过程会通过 <code>SSE</code> 实时输出滚动进度文本，而不是伪造固定百分比。任务完成后，列表会自动刷新。</p>
<blockquote class="is-success">
<p><code>智能助手整理</code> 是独立接口，不等同于传统的 <code>/redo</code> 文本命令。</p>
</blockquote>
<h2 id="climoviepilot-agent" class="toc-header"><a class="toc-anchor" href="#climoviepilot-agent">¶</a> CLI：moviepilot agent</h2>
<p>本地 CLI 模式下，可直接向智能助手发送请求：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot agent 帮我分析最近一次搜索失败的原因
moviepilot agent --user-id admin 帮我检查当前下载器配置
moviepilot agent --session cli-debug-1 帮我看看为什么没有自动整理
</code></pre>
<p>适合：</p>
<ul>
<li>快速检查当前配置</li>
<li>让智能助手分析日志、订阅、下载器、整理等问题</li>
<li>与本地实例进行一次临时对话，而不必进入 WEB 界面</li>
</ul>
<p>更多命令说明参考 <a href="/cli" class="is-internal-link is-valid-page">本地 CLI</a>。</p>
<h2 id="消息渠道远程交互" class="toc-header"><a class="toc-anchor" href="#消息渠道远程交互">¶</a> 消息渠道：远程交互</h2>
<p>完成对应通知渠道配置后，智能助手也可以通过消息入口参与交互。常见场景包括：</p>
<ul>
<li>发送文本让智能助手分析问题</li>
<li>发送 <code>/skills</code> 浏览已安装技能和技能市场，并直接完成安装、删除、搜索、刷新等操作</li>
<li>在支持附件能力的渠道中发送图片或文件，让智能助手结合附件内容处理</li>
<li>在支持语音能力的渠道中发送语音并自动转写后继续对话</li>
</ul>
<p>消息渠道本身的接入方式参考 <a href="/notification" class="is-internal-link is-valid-page">通知</a>。</p>
<h1 id="你可以这样和它说" class="toc-header"><a class="toc-anchor" href="#你可以这样和它说">¶</a> 你可以这样和它说</h1>
<p>下面这些表达方式，通常都比“帮我看一下”更容易让智能助手直接做事：</p>
<ul>
<li><code>帮我检查当前下载器配置有没有明显问题</code></li>
<li><code>搜索《最后生还者》第二季的资源，优先免费和 1080p</code></li>
<li><code>看看《人生切割术》是不是已经订阅过了，没有的话帮我加上</code></li>
<li><code>帮我分析最近一次整理失败，如果能自动修就直接重试</code></li>
<li><code>列出最近 20 条整理失败记录</code></li>
<li><code>测试一下 HDC 的站点连通性</code></li>
<li><code>看看 Plex 最近入库了哪些剧</code></li>
<li><code>列出当前所有插件命令，并告诉我哪个命令能做签到</code></li>
<li><code>我发你一个日志文件，你帮我定位为什么没有自动整理</code></li>
<li><code>我发你一张截图，你帮我判断这个站点是不是登录失效</code></li>
</ul>
<h1 id="常见场景" class="toc-header"><a class="toc-anchor" href="#常见场景">¶</a> 常见场景</h1>
<h2 id="h-1-首次安装时一并完成-ai-配置" class="toc-header"><a class="toc-anchor" href="#h-1-首次安装时一并完成-ai-配置">¶</a> 1. 首次安装时一并完成 AI 配置</h2>
<p>建议在初始化向导中直接填好模型、密钥与图片能力开关，避免后续再分散到多个设置页里补配置。</p>
<h2 id="h-2-搜索结果太多希望二次筛选" class="toc-header"><a class="toc-anchor" href="#h-2-搜索结果太多希望二次筛选">¶</a> 2. 搜索结果太多，希望二次筛选</h2>
<p>先完成普通搜索，再使用 <code>AI智能推荐</code> 对当前结果做进一步筛选与排序。</p>
<h2 id="h-3-某条整理记录反复失败" class="toc-header"><a class="toc-anchor" href="#h-3-某条整理记录反复失败">¶</a> 3. 某条整理记录反复失败</h2>
<p>在 <code>历史记录</code> 中优先尝试 <code>智能助手整理</code>。如果你更清楚正确的媒体 ID 或类型，也仍然可以使用传统的手工重整或 <code>/redo</code>。</p>
<h2 id="h-4-模型不支持多模态" class="toc-header"><a class="toc-anchor" href="#h-4-模型不支持多模态">¶</a> 4. 模型不支持多模态</h2>
<p>关闭 <code>LLM_SUPPORT_IMAGE_INPUT</code> 即可。图片仍会保存为本地附件，并通过文件路径交给智能助手，不会因为模型不支持图片输入而整条消息失效。</p>
