<p>MoviePilot在docker境像中同时还内置了<code>虚拟显示</code>、<code>浏览器仿真</code>、<code>内建重启</code>、<code>代理缓存</code>等特性，<strong>推荐使用docker方式安装</strong>。<br>
使用 <code>docker run -itd</code> 命令安装时，请去除其中的 <code>#</code> 开头的注释行，以防报错。</p>
<blockquote class="is-warning">
<p>V3 兼容 V2 的配置和数据库数据，未使用 V3 变更合同的插件可直接复用；需要适配的插件应安装开发者提供的 V3 专用版本。从 V2 切换到 V3 无需迁移用户数据，保留原有 <code>/config</code> 映射和数据库配置即可。请先备份数据，将镜像更换为 <code>jxxghp/moviepilot-v3:latest</code>，重新拉取并重建容器；不能仅通过重启 V2 容器跨主版本升级。V3 完成数据库升级后不能直接换回 V2 镜像，回退方法见 <a href="/upgrade#%E4%BB%8E-v3-%E9%99%8D%E7%BA%A7%E5%9B%9E-v2" class="is-internal-link is-valid-page">从 V3 降级回 V2</a>。详见 <a href="/v3" class="is-internal-link is-valid-page">V3 版本说明</a> 和插件仓库的 <a href="https://github.com/jxxghp/MoviePilot-Plugins/blob/main/docs/V3_Plugin_Adaptation.md" class="is-external-link">V2 插件迁移到 V3</a>。</p>
</blockquote>
<tabset><template v-slot:tabs=""><li>V3版本</li><li>V2版本</li><li>V1版本</li></template><template v-slot:content=""><div class="tabset-panel"><p>V3 正式版镜像为 <code>jxxghp/moviepilot-v3:latest</code>，也可以将标签替换为具体的 <code>3.0.0</code> 等版本号。下例为全新安装路径；从 V2 切换时，将 <code>/moviepilot-v3/config</code> 替换为原 V2 配置目录即可复用数据。V3 全新启动不会预置管理员用户、密码或 API Key，首次访问 Web 地址时会进入初始化页面，填写管理员用户名、密码（需确认两次）并生成 API Key 后保存，再跳转到登录页面。</p><p>V3 停止时会依次关闭后台任务、插件和其他运行模块。建议为容器预留 <code>120</code> 秒优雅停止时间，避免 Docker 使用默认的较短等待时间强制终止仍在收尾的进程。</p><p>V3 镜像内置 supervisor，同时托管 Nginx 和后端进程。Web 内建重启由容器内 supervisor 完成，不需要映射<br>
<code>/var/run/docker.sock</code>，也不依赖 Docker 的容器重启策略；<code>--restart always</code> 仅用于容器整体异常退出或主机重启后的恢复。</p><pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">docker run -itd \
    --name moviepilot-v3 \
    --hostname moviepilot-v3 \
    --network bridge \
    -p 3000:3000 \
    -p 3001:3001 \
    -v /media:/media \
    -v /moviepilot-v3/config:/config \
    -v /moviepilot-v3/core:/moviepilot/.cloakbrowser \
    -e 'NGINX_PORT=3000' \
    -e 'PORT=3001' \
    -e 'PUID=0' \
    -e 'PGID=0' \
    -e 'UMASK=000' \
    -e 'TZ=Asia/Shanghai' \
    --stop-timeout 120 \
    --restart always \
    jxxghp/moviepilot-v3:latest
</code></pre></div><div class="tabset-panel"><pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">docker run -itd \
    --name moviepilot-v2 \
    --hostname moviepilot-v2 \
    --network bridge \
    -p 3000:3000 \
    -p 3001:3001 \
    -v /media:/media \
    -v /moviepilot-v2/config:/config \
    -v /moviepilot-v2/core:/moviepilot/.cloakbrowser \
    -v /var/run/docker.sock:/var/run/docker.sock:ro \
    -e 'NGINX_PORT=3000' \
    -e 'PORT=3001' \
    -e 'PUID=0' \
    -e 'PGID=0' \
    -e 'UMASK=000' \
    -e 'TZ=Asia/Shanghai' \
    -e 'SUPERUSER=admin' \ #超级管理员用户名
    -e 'SUPERUSER_PASSWORD=你的初始登录密码' \ #超级管理员初始密码
    --restart always \
    jxxghp/moviepilot-v2:latest
</code></pre></div><div class="tabset-panel"><pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">docker run -itd \
    --name moviepilot \
    --hostname moviepilot \
    -p 3000:3000 \
    -v /media:/media \
    -v /moviepilot/config:/config \
    -v /moviepilot/core:/moviepilot/moviepilot/.cache/ms-playwright \
    -v /var/run/docker.sock:/var/run/docker.sock:ro \
    -e 'NGINX_PORT=3000' \
    -e 'PORT=3001' \
    -e 'PUID=0' \
    -e 'PGID=0' \
    -e 'UMASK=000' \
    -e 'TZ=Asia/Shanghai' \
    -e 'AUTH_SITE=iyuu' \
    -e 'IYUU_SIGN=xxxx' \
    -e 'SUPERUSER=admin' \
    -e 'API_TOKEN=建议大于16位的复杂字符串' \
    --restart always \
    jxxghp/moviepilot:latest
</code></pre></div></template></tabset>









<tabset><template v-slot:tabs=""><li>V3-全功能版</li><li>V3-小白版</li><li>V2-全功能版</li><li>V2-纯净版</li><li>V2-小白版</li><li>V1版本</li></template><template v-slot:content=""><div class="tabset-panel"><p>下例使用 V3 的全新安装路径。从 V2 切换时无需迁移数据：保留原 <code>/config</code> 映射、PostgreSQL 数据卷、Redis 数据卷及对应连接配置，只需将 MoviePilot 镜像更换为 V3 后拉取并重建容器。<code>pgloader</code> 默认不启动，仅在需要将 SQLite 转换为 PostgreSQL 时手动启用，与 V2 升级 V3 无关。</p><pre class="prismjs line-numbers" v-pre="true"><code class="language-yaml">services:

  moviepilot:
    stdin_open: true
    tty: true
    container_name: moviepilot-v3
    hostname: moviepilot-v3
    ports:
      - '3000:3000'
      - '3001:3001'
    volumes:
      - '/media:/media' #媒体
      - '/moviepilot-v3/config:/config' #持久化配置
      - '/moviepilot-v3/core:/moviepilot/.cloakbrowser' #内核浏览器
      - '/tr/config/torrents:/torrents' #TR种子位置
      - '/qbittorrent/data/data/BT_backup:/BT_backup' #QB种子位置
    environment:
      - 'NGINX_PORT=3000'
      - 'PORT=3001'
      - 'PUID=0'
      - 'PGID=0'
      - 'UMASK=000'
      - 'TZ=Asia/Shanghai'
      - 'DB_TYPE=postgresql'
      - 'DB_POSTGRESQL_HOST=postgresql'
      - 'DB_POSTGRESQL_PORT=5432'
      - 'DB_POSTGRESQL_DATABASE=moviepilot'
      - 'DB_POSTGRESQL_USERNAME=moviepilot'
      - 'DB_POSTGRESQL_PASSWORD=pg_password'
      - 'CACHE_BACKEND_TYPE=redis'
      - 'CACHE_BACKEND_URL=redis://:redis_password@redis:6379'
    restart: always
    stop_grace_period: 120s
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: jxxghp/moviepilot-v3:latest

  redis:
    volumes:
      - /volume1/docker/redis/data:/data
    image: redis
    command: redis-server --save 600 1 --requirepass redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: moviepilot
      POSTGRES_USER: moviepilot
      POSTGRES_PASSWORD: pg_password
    volumes:
      # 仅 postgresql 18.0+ 及以上版本可用，根据版本二选一即可
      - /volume1/docker/postgresql:/var/lib/postgresql
      # 仅 postgresql 17.6 及以下版本可用，根据版本二选一即可
      #- /volume1/docker/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviepilot -d moviepilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 可选：仅用于将 SQLite 转换为 PostgreSQL，与 V2 升级 V3 无关
  pgloader:
    profiles:
      - migration
    image: dimitri/pgloader:latest
    volumes:
      - &lt;MP配置文件路径&gt;:/mp_config
    command: &gt;
      pgloader
      sqlite:///mp_config/user.db
      postgresql://moviepilot:pg_password@postgresql:5432/moviepilot
    depends_on:
      postgresql:
        condition: service_healthy
</code></pre></div><div class="tabset-panel"><p>这个版本适合第一次使用 Docker、只需要单个 MoviePilot 容器的场景。它使用内置的 SQLite 数据库和缓存，不需要另外配置 PostgreSQL、Redis 或 Docker Socket。把下面内容保存为 <code>docker-compose.yml</code>，只需要先修改 3 个宿主机目录：</p><ul>
<li><code>/media</code>：媒体库和下载目录的共同根目录。计划使用硬链接时，请让下载目录和媒体库都位于这个根目录下。</li>
<li><code>/moviepilot-v3/config</code>：保存配置、数据库和日志，不能删除。</li>
<li><code>/moviepilot-v3/core</code>：保存浏览器内核，避免容器重建后重复下载。</li>
</ul><pre class="prismjs line-numbers" v-pre="true"><code class="language-yaml">services:
  moviepilot:
    stdin_open: true # 保持标准输入流打开
    tty: true # 分配伪终端
    container_name: moviepilot-v3 # 容器名称
    hostname: moviepilot-v3 # 容器主机名

    # 端口映射：宿主机端口:容器端口
    ports:
      - '3000:3000' # Web 页面，浏览器访问宿主机 3000 端口
      - '3001:3001' # API 接口

    # 目录映射：宿主机目录:容器内目录
    volumes:
      - '/media:/media' # 媒体库和下载目录
      - '/moviepilot-v3/config:/config' # 配置、数据库和日志
      - '/moviepilot-v3/core:/moviepilot/.cloakbrowser' # 浏览器内核

    # 基础环境变量
    environment:
      - 'NGINX_PORT=3000' # Web 页面端口
      - 'PORT=3001' # API 端口
      - 'PUID=0' # 运行用户 ID
      - 'PGID=0' # 运行用户组 ID
      - 'UMASK=000' # 新建文件权限掩码
      - 'TZ=Asia/Shanghai' # 时区

    restart: always # 容器退出或主机重启后自动启动
    stop_grace_period: 120s # 给 V3 足够时间完成退出清理
    image: jxxghp/moviepilot-v3:latest
</code></pre><p>在 <code>docker-compose.yml</code> 所在目录执行：</p><pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">docker compose up -d

      sqlite:///mp_config/user.db 
      postgresql://moviepilot:pg_password@postgresql:5432/moviepilot
    depends_on:
      postgresql:
        condition: service_healthy

<li><code>/media</code>为媒体文件目录，根据实际情况调整，需要注意的是，<strong>如果你计划使用<code>硬链接</code>来整理文件，那么<code>文件下载目录</code>和整理后的<code>媒体库目录</code>只能映射一个根目录不能分开映射，否则将会导致跨盘无法硬链接。</strong> 这是由docker的目录映射机制决定的，下面这些情况都会导致跨盘无法硬链接：
<ol>
<li>下载目录和媒体库目录分别属于两个不同的磁盘</li>
<li>下载目录和媒体库目录属于同一磁盘，但在两个不同的分区/存储空间/存储池中</li>
<li>下载目录和媒体库目录分别作为两个目录路径映射到docker容器中</li>
</ol>
</li>
<li><code>/moviepilot/config</code>为配置文件、数据库文件、日志文件、缓存文件使用的文件目录，该目录将会存储所有设置和数据，需根据实际情况调整。</li>
<li><code>/moviepilot/core</code>为浏览器内核下载保存目录（<strong>避免容器重置后重新下载浏览器内核</strong>），需根据实际情况调整。</li>
<li>默认使用<code>3000</code>为WEB服务端口，<code>3001</code>为Api服务端口，可根据实际情况调整。</li>
<li>V3 全新安装无需在 Docker 模板中填写 <code>SUPERUSER</code>、<code>SUPERUSER_PASSWORD</code> 或 <code>API_TOKEN</code>：首次访问 Web 地址会进入初始化页面，保存后才会写入管理员账号、密码和 API Key。V2、V1 的模板和首次启动配置方式保持不变；其它变量请根据 <a href="/configuration" class="is-internal-link is-valid-page">配置参考</a> 说明调整和补充。</li>
</ul></div></template></tabset>





















<h1 id="windows" class="toc-header"><a class="toc-anchor" href="#windows">¶</a> Windows</h1>
<p>Windows环境下提供两种安装方式，推荐使用<code>安装版本</code>。</p>
<h3 id="可执行文件版本" class="toc-header"><a class="toc-anchor" href="#可执行文件版本">¶</a> 可执行文件版本</h3>
<p>项目在编译时，将Python以及相关的代码打包到一个exe文件中使用，点击 <a href="https://github.com/jxxghp/MoviePilot/releases" class="is-external-link">此处</a> 下载exe文件，双击运行后会自动生成<code>config</code>配置文件目录，以及<code>nginx</code>前端资源目录，正常运行后会操作系统任务栏会生成MoviePilot图标，输入<code>localhost:3000</code>可访问后端管理WEB。</p>
<ul>
<li>如运行后无法正常解压，请使用<strong>管理员权限</strong>运行。</li>
<li>如被杀毒软拦截，则需要将运行目录加入<strong>白名单</strong>放行，因打包方式的原因有的杀毒软件会识判为病毒。</li>
<li><strong>还需根据  <a href="/configuration" class="is-internal-link is-valid-page">配置参考</a> ，在 <code>Windows 系统属性 -&gt; 高级设置 -&gt; 环境变量</code>中添加认证等环境变量。</strong></li>
<li>由于该版本是预编译后再打包的方式，在功能上存在一定的限制，比如不支持<code>内建重启</code>、除<code>内置插件库</code>外不支持安装其它第三方插件库插件等。</li>
</ul>
<h3 id="安装版本" class="toc-header"><a class="toc-anchor" href="#安装版本">¶</a> 安装版本</h3>
<p>由 <a href="https://github.com/developer-wlj/Windows-MoviePilot" class="is-external-link">Windows-MoviePilot</a> 项目提供，参考项目说明使用。</p>
<p>V2版本：<a href="https://github.com/developer-wlj/Windows-MoviePilot/tree/v2" class="is-external-link">https://github.com/developer-wlj/Windows-MoviePilot/tree/v2</a></p>
<h1 id="synology套件" class="toc-header"><a class="toc-anchor" href="#synology套件">¶</a> Synology套件</h1>
<p>DSM7 添加套件源：<a href="https://spk7.imnks.com/" class="is-external-link">https://spk7.imnks.com/</a> ，安装后通过<code>MoviePilot配置</code>入口，根据  <a href="/configuration" class="is-internal-link is-valid-page">配置参考</a> 进行配置使用。</p>
<p>该套件由套件源作者维护，如有问题需要向套件源维护方寻求帮助。</p>
<h1 id="本地-climacos-linux" class="toc-header"><a class="toc-anchor" href="#本地-climacos-linux">¶</a> 本地 CLI（macOS / Linux）</h1>
<p>MoviePilot V2 现已提供本地 CLI 安装模式，适合不使用 Docker、希望直接在本机管理前后端服务的场景。</p>
<p>一键安装命令：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">curl -fsSL https://raw.githubusercontent.com/jxxghp/MoviePilot/v2/scripts/bootstrap-local.sh | bash
</code></pre>
<p>脚本会自动：</p>
<ul>
<li>检测操作系统</li>
<li>自动检查并尽量安装 <code>git</code>、<code>curl</code>、<code>Python 3.12+</code></li>
<li>下载主项目</li>
<li>下载前端 release</li>
<li>下载资源文件并同步到 <code>app/helper</code></li>
<li>自动安装本地 <code>Node</code> 运行时</li>
<li>执行初始化向导</li>
<li>创建全局 <code>moviepilot</code> 命令</li>
<li>默认启动前后端服务</li>
</ul>
<p>首次安装完成后，向导会继续引导完成初始化配置。当前初始化向导已覆盖：</p>
<ul>
<li>基础参数
<ul>
<li>应用域名</li>
<li>管理员密码</li>
<li><code>API_TOKEN</code></li>
<li><code>OCR_HOST</code></li>
<li><code>PROXY_HOST</code></li>
<li><code>GITHUB_TOKEN</code></li>
</ul>
</li>
<li>用户站点认证
<ul>
<li>直接读取当前支持的认证站点</li>
<li>按站点动态展示 <code>UID</code>、<code>Passkey</code>、用户名等字段</li>
</ul>
</li>
<li>存储目录
<ul>
<li>下载目录</li>
<li>媒体库目录</li>
<li>整理方式</li>
<li>覆盖策略</li>
</ul>
</li>
<li>下载器</li>
<li>媒体服务器</li>
<li>通知渠道</li>
<li>智能助手
<ul>
<li><code>AI_AGENT_ENABLE</code></li>
<li><code>LLM_PROVIDER</code></li>
<li><code>LLM_MODEL</code></li>
<li><code>LLM_API_KEY</code></li>
<li><code>LLM_BASE_URL</code></li>
<li><code>LLM_THINKING_LEVEL</code></li>
<li><code>LLM_SUPPORT_IMAGE_INPUT</code></li>
<li><code>LLM_SUPPORT_AUDIO_INPUT</code> 与 <code>AUDIO_INPUT_*</code></li>
<li><code>LLM_SUPPORT_AUDIO_OUTPUT</code> 与 <code>AUDIO_OUTPUT_*</code></li>
<li><code>AI_RECOMMEND_ENABLED</code></li>
</ul>
</li>
<li>资源偏好</li>
</ul>
<p class="is-info">安装向导默认使用 <code>themoviedb</code> 作为识别来源，不再在首次安装流程中暴露识别源选择，避免误导新用户。</p>
<p>安装完成后可直接使用：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot status
moviepilot logs --frontend
moviepilot logs --stdio
moviepilot config path
</code></pre>
<p>常用管理命令：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-shell">moviepilot start
moviepilot stop
moviepilot restart
moviepilot update all
moviepilot setup --wizard
moviepilot uninstall
moviepilot agent 帮我检查当前配置
</code></pre>
<p>本地 CLI 默认会将配置目录放在程序目录外：</p>
<ul>
<li>macOS：<code>~/Library/Application Support/MoviePilot</code></li>
<li>Linux：<code>${XDG_CONFIG_HOME:-~/.config}/moviepilot</code></li>
</ul>
<p>完整命令和说明参考：<a href="/cli" class="is-internal-link is-valid-page">本地 CLI</a></p>
<h1 id="源代码运行开发调试" class="toc-header"><a class="toc-anchor" href="#源代码运行开发调试">¶</a> 源代码运行（开发调试）</h1>
<p>如果你的目的是二次开发、插件开发或前端联调，请参考：</p>
<ul>
<li><a href="/cli" class="is-internal-link is-valid-page">本地 CLI</a> 完成本地运行环境初始化</li>
<li><a href="/plugindev" class="is-internal-link is-valid-page">插件开发</a> 查看开发模式相关说明</li>
</ul>
<p>不再推荐手工复制前端、资源和依赖后再分别启动多个项目；普通本地运行场景请优先使用 <code>moviepilot</code> CLI。</p>
<h1 id="反向代理" class="toc-header"><a class="toc-anchor" href="#反向代理">¶</a> 反向代理</h1>
<p>如需开启域名访问MoviePilot，则需要搭建反向代理服务。以<code>nginx</code>为例，需要添加以下配置项，否则可能会导致部分功能无法访问（<code>ip:port</code>修改为实际值）：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-nginx">location / {
    proxy_pass http://ip:port;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
</code></pre>
<p>反向代理使用SSL时，还需要开启http2，否则会导致日志加载时间过长或不可用：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-nginx">server {
    listen 443 ssl;
    http2 on;
    # ...
}
</code></pre>
<p><strong>代理服务连接超时时间应尽量长⼀些，比如10分钟，避免代理服务器强制中断请求。</strong></p>
