apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: prototype
  version: 1.0.0
  description: "Build a throwaway prototype to answer a design question and capture it as a primary source."
spec:
  entrypoint: SKILL.md
  capabilities:
    - prototype.build
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: write
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
