apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: migrate-to-shoehorn
  version: 1.0.0
  description: "Migrate test files from as type assertions to @total-typescript/shoehorn."
spec:
  entrypoint: SKILL.md
  capabilities:
    - test.migration
  permissions:
    filesystem: write
    network: allow
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
