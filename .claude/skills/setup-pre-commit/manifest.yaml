apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: setup-pre-commit
  version: 1.0.0
  description: "Set up Husky pre-commit hooks with lint-staged, Prettier, type checking, and tests in the current repo."
spec:
  entrypoint: SKILL.md
  capabilities:
    - setup.precommit
  permissions:
    filesystem: write
    network: allow
    subprocess: allow
    git: write
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
