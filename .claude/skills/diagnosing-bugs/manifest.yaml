apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: diagnosing-bugs
  version: 1.0.0
  description: "Diagnosis loop for hard bugs and performance regressions, driven by a tight feedback loop."
spec:
  entrypoint: SKILL.md
  capabilities:
    - debug.diagnose
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: read
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
