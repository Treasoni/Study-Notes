apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: tool-discovery
  version: 1.2.0
  description: "Discover verified runtime tools, MCP services, and project skills for research work."
spec:
  entrypoint: SKILL.md
  capabilities:
    - tools.discover
    - research.tools.catalog
  permissions:
    filesystem: read
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
