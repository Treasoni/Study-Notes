apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: domain-modeling
  version: 1.0.0
  description: "Build and sharpen a project's domain model, writing the glossary and decisions down the moment they crystallise."
spec:
  entrypoint: SKILL.md
  capabilities:
    - domain.modeling
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
