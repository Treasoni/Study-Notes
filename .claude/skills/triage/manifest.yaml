apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: triage
  version: 1.0.0
  description: "Move issues and external PRs through a state machine of triage roles — categorise, verify, grill if needed, and write agent-ready briefs."
spec:
  entrypoint: SKILL.md
  capabilities:
    - triage.manage
  permissions:
    filesystem: write
    network: allow
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
