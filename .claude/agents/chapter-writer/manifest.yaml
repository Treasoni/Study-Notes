apiVersion: agent-platform/v1
kind: Subagent
metadata:
  name: chapter-writer
  version: 1.6.0
  description: "Write learning-note chapters in confirmed batches of up to three; resume in the same context between chapters, pass the shared citation checker (--mode text) before handing a chapter over, never invent values for recipe content (env/config/command), check config skeletons field-by-field against the official complete example file rather than one tutorial section, and label which file each block of a multi-file recipe belongs to."
spec:
  entrypoint: ../chapter-writer.md
  capabilities:
    - notes.chapter.write
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
