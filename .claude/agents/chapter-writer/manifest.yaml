apiVersion: agent-platform/v1
kind: Subagent
metadata:
  name: chapter-writer
  version: 1.2.0
  description: "Write learning-note chapters in confirmed batches of up to three; resume in the same context between chapters."
spec:
  entrypoint: ../chapter-writer.md
  capabilities:
    - notes.chapter.write
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
