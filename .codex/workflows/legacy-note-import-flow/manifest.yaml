apiVersion: agent-platform/v1
kind: Workflow
metadata:
  name: legacy-note-import-flow
  version: 1.1.0
  description: "Import, normalize, and optionally refresh legacy notes in recoverable batches."
spec:
  entrypoint: workflow.md
  capabilities:
    - workflow.notes.legacy-import
  permissions:
    filesystem: write
    network: allow
    subprocess: allow
    git: none
  dependsOn:
    - Skill/legacy-note-importer
    - Skill/note-beautifier
    - Skill/note-updater
    - Skill/moc-organizer
    - Skill/workflow-todo-state
  lifecycle:
    discoverable: true
    deprecated: false
