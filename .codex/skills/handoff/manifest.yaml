apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: handoff
  version: 1.0.0
  description: "Compact the current conversation into a handoff document for another agent to pick up."
spec:
  entrypoint: SKILL.md
  capabilities:
    - handoff.write
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
