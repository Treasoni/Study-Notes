apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: grill-with-docs
  version: 1.0.0
  description: "A relentless interview to sharpen a plan or design, which also creates docs (ADRs and glossary) as it goes."
spec:
  entrypoint: SKILL.md
  capabilities:
    - grill.interview-with-docs
    - domain.modeling
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
