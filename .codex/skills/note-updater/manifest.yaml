apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: note-updater
  version: 1.0.0
  description: "Refresh out-of-date note sections with minimal, evidence-based patches."
spec:
  entrypoint: SKILL.md
  capabilities:
    - notes.update
  permissions:
    filesystem: write
    network: allow
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
