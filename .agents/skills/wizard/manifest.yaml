apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: wizard
  version: 1.0.0
  description: "Generate an interactive bash wizard that walks a human through steps only they can perform."
spec:
  entrypoint: SKILL.md
  capabilities:
    - setup.wizard
  permissions:
    filesystem: write
    network: allow
    subprocess: allow
    git: write
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
