apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: tdd
  version: 1.0.0
  description: "Test-driven development: the red-green loop with tests written at pre-agreed seams."
spec:
  entrypoint: SKILL.md
  capabilities:
    - testdriven.development
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
