apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: scaffold-exercises
  version: 1.0.0
  description: "Create exercise directory structures with sections, problems, solutions, and explainers that pass linting."
spec:
  entrypoint: SKILL.md
  capabilities:
    - scaffold.exercises
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: write
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
