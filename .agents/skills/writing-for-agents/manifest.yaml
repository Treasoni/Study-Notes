apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: writing-for-agents
  version: 1.0.0
  description: "Reference for writing any document an agent consumes, including skills, CLAUDE.md and CLAUDE.md."
spec:
  entrypoint: SKILL.md
  capabilities:
    - writing.for-agents
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
