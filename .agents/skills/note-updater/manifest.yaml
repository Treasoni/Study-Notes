apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: note-updater
  version: 1.4.0
  description: "Refresh out-of-date note sections with minimal, evidence-based patches; recipe content (env/config/command) takes values only from verbatim docs or a minimal local test — never from guesswork."
spec:
  entrypoint: SKILL.md
  capabilities:
    - notes.update
  permissions:
    filesystem: write
    network: allow
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
