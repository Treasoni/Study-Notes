apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: to-spec
  version: 1.0.0
  description: "Turn the current conversation into a spec and publish it to the project issue tracker."
spec:
  entrypoint: SKILL.md
  capabilities:
    - planning.spec
  permissions:
    filesystem: write
    network: allow
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
