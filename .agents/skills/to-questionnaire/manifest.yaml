apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: to-questionnaire
  version: 1.0.0
  description: "Turn a decision you can't fully answer into a questionnaire for someone else to fill in."
spec:
  entrypoint: SKILL.md
  capabilities:
    - document.questionnaire
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
