apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: research-collector
  version: 2.4.0
  description: "Collect and curate staged, source-backed research with a cache-stable prompt contract and batched fan-out (<=3 delegates per phase); forbids paraphrase-as-citation in downstream dispatch and requires the shared citation checker on the artifact before write-out."
spec:
  entrypoint: SKILL.md
  capabilities:
    - research.collect
    - research.curate
  permissions:
    filesystem: write
    network: allow
    subprocess: allow
    git: none
  dependsOn:
    - Skill/prompt-cache-optimizer
    - Skill/workflow-todo-state
  lifecycle:
    discoverable: true
    deprecated: false
