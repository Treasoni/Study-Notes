apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: research-collector
  version: 2.0.0
  description: "Collect and curate staged, source-backed research with a cache-stable prompt contract."
spec:
  entrypoint: SKILL.md
  capabilities:
    - research.collect
    - research.curate
  permissions:
    filesystem: write
    network: allow
    subprocess: none
    git: none
  dependsOn:
    - Skill/prompt-cache-optimizer
    - Skill/workflow-todo-state
  lifecycle:
    discoverable: true
    deprecated: false
