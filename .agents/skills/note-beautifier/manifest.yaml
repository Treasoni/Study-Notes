apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: note-beautifier
  version: 1.4.0
  description: "Format and publish learning notes as Obsidian-friendly Markdown; requires wikilink targets to exist, anchors to avoid special characters, and the shared citation checker (.codex/scripts/note-citation-check.py) to pass before publishing."
spec:
  entrypoint: SKILL.md
  capabilities:
    - obsidian.note.beautify
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
