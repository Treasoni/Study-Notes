apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: claude-handoff
  version: 1.0.0
  description: "Hand the current conversation off to a fresh background agent that picks up the work immediately."
spec:
  entrypoint: SKILL.md
  capabilities:
    - handoff.launch
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
