apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: loop-me
  version: 1.0.0
  description: "Grill the user about the workflows they want to build, producing workflow specs in the workspace."
spec:
  entrypoint: SKILL.md
  capabilities:
    - workflow.specification
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
