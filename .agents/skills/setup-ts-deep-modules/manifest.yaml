apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: setup-ts-deep-modules
  version: 1.0.0
  description: "Wire dependency-cruiser into a TypeScript repo so each package is a deep module, then prove the rules bite."
spec:
  entrypoint: SKILL.md
  capabilities:
    - setup.ts-deep-modules
  permissions:
    filesystem: write
    network: allow
    subprocess: allow
    git: write
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
