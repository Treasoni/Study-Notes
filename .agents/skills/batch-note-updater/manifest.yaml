apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: batch-note-updater
  version: 1.1.0
  description: "Plan and orchestrate safe partial updates across multiple existing notes. The plan checks each note's upstream upkeep (`pushed_at`/`archived`) and marks an unmaintained upstream as a cross-set re-source rather than a partial update, keeping official separate from community integration scripts."
spec:
  entrypoint: SKILL.md
  capabilities:
    - notes.batch-update
  permissions:
    filesystem: write
    network: allow
    subprocess: none
    git: none
  dependsOn:
    - Skill/note-updater
  lifecycle:
    discoverable: true
    deprecated: false
