apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: teach
  version: 1.0.0
  description: "Teach the user a new skill or concept over multiple sessions, using the current directory as a stateful workspace."
spec:
  entrypoint: SKILL.md
  capabilities:
    - teaching.workspace
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
